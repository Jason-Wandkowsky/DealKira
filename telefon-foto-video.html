<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foto & Video – DealKira</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f5f5f5;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      height: 72px;
      background: #111;
      padding: 0 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
    }

    .logo {
      width: 220px;
      height: 55px;
      display: flex;
      align-items: center;
      overflow: visible;
    }

    .logo img {
      height: 240px;
      width: auto;
      max-width: none;
      display: block;
    }

    .menu-button {
      width: 48px;
      height: 48px;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    .menu-button span {
      width: 23px;
      height: 3px;
      background: #ffd400;
      border-radius: 2px;
      transition: 0.25s;
    }

    .menu-button:hover {
      background: #252525;
      border-color: #ffd400;
    }

    .menu-button.active span:nth-child(1) {
      transform: translateY(8px) rotate(45deg);
    }

    .menu-button.active span:nth-child(2) {
      opacity: 0;
    }

    .menu-button.active span:nth-child(3) {
      transform: translateY(-8px) rotate(-45deg);
    }

    .menu-panel {
      position: absolute;
      top: 82px;
      right: 6%;
      width: 270px;
      background: #111;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 10px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: 0.2s;
    }

    .menu-panel.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .menu-panel a {
      display: flex;
      align-items: center;
      gap: 12px;
      color: white;
      text-decoration: none;
      padding: 14px 15px;
      border-radius: 9px;
      font-weight: 700;
    }

    .menu-panel a:hover {
      background: #222;
      color: #ffd400;
    }

    .menu-icon {
      width: 25px;
      text-align: center;
      font-size: 19px;
    }

    .menu-divider {
      height: 1px;
      background: #333;
      margin: 8px 5px;
    }

    .page-header {
      background: linear-gradient(135deg, #111, #222);
      color: white;
      padding: 70px 6%;
      text-align: center;
    }

    .page-header h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .page-header h1 span {
      color: #ffd400;
    }

    .page-header p {
      color: #ccc;
      font-size: 18px;
    }

    .empty-state {
      max-width: 700px;
      margin: 70px auto;
      padding: 55px 30px;
      background: white;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    .empty-icon {
      font-size: 65px;
      margin-bottom: 20px;
    }

    .empty-state h2 {
      font-size: 26px;
      margin-bottom: 10px;
    }

    .empty-state p {
      color: #666;
      font-size: 16px;
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 35px 20px;
      margin-top: 100px;
    }

    footer strong {
      color: #ffd400;
    }

    footer p {
      margin-top: 6px;
      color: #aaa;
    }

    @media (max-width: 800px) {
      header {
        padding: 0 5%;
      }

      .logo {
        width: 180px;
      }

      .logo img {
        height: 210px;
      }

      .menu-panel {
        right: 5%;
      }

      .page-header h1 {
        font-size: 34px;
      }
    }

    @media (max-width: 550px) {
      header {
        height: 68px;
      }

      .logo {
        width: 145px;
      }

      .logo img {
        height: 184px;
      }

      .menu-button {
        width: 45px;
        height: 45px;
      }

      .menu-panel {
        top: 78px;
        right: 5%;
        width: 260px;
      }

      .page-header {
        padding: 55px 5%;
      }

      .page-header h1 {
        font-size: 30px;
      }

      .page-header p {
        font-size: 16px;
      }

      .empty-state {
        margin: 50px 5%;
        padding: 45px 20px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    <img src="20879_nobg (1).png" alt="DealKira Logo">
  </div>

  <button
    class="menu-button"
    id="menuButton"
    onclick="toggleMenu()"
    aria-label="Menü öffnen"
    aria-expanded="false">

    <span></span>
    <span></span>
    <span></span>

  </button>

  <div class="menu-panel" id="menuPanel">

    <a href="index.html">
      <span class="menu-icon">🏠</span>
      Startseite
    </a>

    <a href="deals.html">
      <span class="menu-icon">🔥</span>
      Deals
    </a>

    <a href="kategorien.html">
      <span class="menu-icon">📂</span>
      Kategorien
    </a>

    <a href="suche.html">
      <span class="menu-icon">🔍</span>
      Suche
    </a>

    <div class="menu-divider"></div>

    <a href="konto.html">
      <span class="menu-icon">👤</span>
      Konto / Anmelden
    </a>

  </div>

</header>


<section class="page-header">

  <h1><span>Foto & Video</span></h1>

  <p>
    Foto- und Video-Zubehör für Smartphones und Tablets.
  </p>

</section>


<section class="empty-state">

  <div class="empty-icon">📷</div>

  <h2>Noch keine Produkte vorhanden</h2>

  <p>
    In dieser Kategorie werden bald passende Produkte und Deals angezeigt.
  </p>

</section>


<footer>

  <strong>DealKira</strong>

  <p>
    Produkte entdecken. Deals finden. Preise vergleichen.
  </p>

</footer>


<script>

  function toggleMenu() {

    const menu = document.getElementById("menuPanel");
    const button = document.getElementById("menuButton");

    const isOpen = menu.classList.toggle("open");

    button.classList.toggle("active");

    button.setAttribute("aria-expanded", isOpen);

  }


  function closeMenu() {

    const menu = document.getElementById("menuPanel");
    const button = document.getElementById("menuButton");

    menu.classList.remove("open");
    button.classList.remove("active");

    button.setAttribute("aria-expanded", "false");

  }


  document.addEventListener("click", function(event) {

    const menu = document.getElementById("menuPanel");
    const button = document.getElementById("menuButton");

    if (
      !menu.contains(event.target) &&
      !button.contains(event.target)
    ) {
      closeMenu();
    }

  });


  document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {
      closeMenu();
    }

  });

</script>

</body>
</html>
