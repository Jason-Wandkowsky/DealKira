<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tablet – DealKira</title>
  <meta name="description" content="Tablet-Preise verschiedener Shops vergleichen – DealKira">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      height: 72px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      width: 280px;
      height: 65px;
      display: flex;
      align-items: center;
      overflow: visible;
      position: relative;
    }

    .logo img {
      height: 320px;
      width: auto;
      max-width: none;
      display: block;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    nav a {
      color: white;
      font-size: 16px;
      font-weight: 600;
      transition: color 0.2s;
    }

    nav a:hover {
      color: #ffd400;
    }

    .menu-button {
      display: none;
      color: white;
      font-size: 30px;
      cursor: pointer;
      background: none;
      border: none;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      background: #111;
      color: white;
      padding: 55px 20px 50px;
      text-align: center;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 18px;
      color: #ddd;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 35px 20px 70px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 25px;
      font-size: 15px;
      font-weight: 700;
      color: #111;
    }

    .back-link:hover {
      color: #d4af00;
    }

    .product-box {
      background: white;
      border-radius: 18px;
      padding: 35px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    .product-top {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 45px;
      align-items: start;
    }

    /* =========================
       PRODUCT IMAGE
    ========================= */

    .product-image-area {
      width: 100%;
      min-height: 330px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafafa;
      border-radius: 16px;
      padding: 25px;
    }

    .product-image {
      max-width: 100%;
      max-height: 330px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .no-image {
      color: #888;
      font-size: 15px;
      text-align: center;
    }

    /* =========================
       PRODUCT INFO
    ========================= */

    .product-info {
      padding-top: 5px;
    }

    .product-brand {
      font-size: 14px;
      font-weight: 700;
      color: #777;
      text-transform: uppercase;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .product-info h1 {
      font-size: 36px;
      line-height: 1.15;
      margin-bottom: 18px;
    }

    .product-series {
      display: inline-block;
      background: #ffd400;
      color: #111;
      font-size: 14px;
      font-weight: 700;
      padding: 8px 13px;
      border-radius: 8px;
      margin-bottom: 25px;
    }

    .product-description {
      color: #555;
      font-size: 16px;
      line-height: 1.6;
    }

    /* =========================
       SHOP COMPARISON
    ========================= */

    .comparison {
      margin-top: 45px;
    }

    .comparison h2 {
      font-size: 27px;
      margin-bottom: 18px;
    }

    .comparison-intro {
      color: #666;
      font-size: 15px;
      margin-bottom: 20px;
    }

    .shops {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .shop-row {
      display: grid;
      grid-template-columns: 1fr 180px 150px;
      align-items: center;
      gap: 20px;
      border: 1px solid #e4e4e4;
      border-radius: 13px;
      padding: 17px 18px;
      background: #fff;
    }

    .shop-name {
      font-size: 17px;
      font-weight: 700;
    }

    .shop-price {
      font-size: 18px;
      font-weight: 700;
      text-align: right;
    }

    .shop-button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      background: #ffd400;
      color: #111;
      padding: 11px 15px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 700;
      transition: transform 0.15s, background 0.15s;
    }

    .shop-button:hover {
      background: #e8c000;
      transform: translateY(-1px);
    }

    .no-link {
      text-align: center;
      color: #999;
      font-size: 13px;
    }

    .no-shops {
      padding: 25px;
      background: #f7f7f7;
      border-radius: 12px;
      color: #777;
      text-align: center;
    }

    /* =========================
       ERROR
    ========================= */

    .error-box {
      background: white;
      border-radius: 18px;
      padding: 45px 25px;
      text-align: center;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    .error-box h1 {
      font-size: 30px;
      margin-bottom: 15px;
    }

    .error-box p {
      color: #666;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .error-button {
      display: inline-block;
      background: #ffd400;
      color: #111;
      padding: 12px 20px;
      border-radius: 9px;
      font-weight: 700;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      background: #000;
      color: #aaa;
      text-align: center;
      padding: 30px 20px;
      font-size: 14px;
    }

    footer a {
      color: #aaa;
      margin: 0 8px;
    }

    footer a:hover {
      color: #ffd400;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media(max-width: 800px) {

      header {
        padding: 0 15px;
      }

      .logo {
        width: 225px;
      }

      .logo img {
        height: 275px;
      }

      nav {
        display: none;
      }

      .menu-button {
        display: block;
      }

      .hero {
        padding: 45px 18px 40px;
      }

      .hero h1 {
        font-size: 32px;
      }

      .hero p {
        font-size: 16px;
      }

      main {
        padding: 25px 12px 50px;
      }

      .product-box {
        padding: 20px;
      }

      .product-top {
        grid-template-columns: 1fr;
        gap: 25px;
      }

      .product-image-area {
        min-height: 280px;
      }

      .product-info h1 {
        font-size: 29px;
      }

      .shop-row {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .shop-price {
        text-align: left;
      }

      .shop-button {
        width: 100%;
      }
    }

    @media(max-width: 550px) {

      .logo {
        width: 190px;
        height: 50px;
      }

      .logo img {
        height: 235px;
      }

      .menu-button {
        font-size: 27px;
      }

      .hero h1 {
        font-size: 27px;
      }

      .hero p {
        font-size: 15px;
      }

      .product-box {
        padding: 15px;
        border-radius: 14px;
      }

      .product-image-area {
        min-height: 240px;
        padding: 18px;
      }

      .product-image {
        max-height: 240px;
      }

      .product-info h1 {
        font-size: 25px;
      }

      .comparison h2 {
        font-size: 23px;
      }
    }

    @media(max-width: 380px) {

      .logo {
        width: 170px;
      }

      .logo img {
        height: 215px;
      }

      .product-info h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <header>

    <a href="index.html" class="logo">
      <img src="20879_nobg (1).png" alt="DealKira">
    </a>

    <nav>
      <a href="index.html">Startseite</a>
      <a href="deals.html">Deals</a>
      <a href="telefon.html">Telefone</a>
      <a href="tablets.html">Tablets</a>
      <a href="konto.html">Konto</a>
    </nav>

    <button class="menu-button" onclick="toggleMenu()" aria-label="Menü">
      ☰
    </button>

  </header>

  <!-- =========================
       HERO
  ========================= -->

  <section class="hero">
    <h1>Produktvergleich</h1>
    <p>Tablet-Preise verschiedener Shops vergleichen</p>
  </section>

  <!-- =========================
       MAIN
  ========================= -->

  <main>

    <a href="tablets.html" class="back-link">
      ← Zurück zu den Tablets
    </a>

    <div id="product-container">
      <div class="error-box">
        <h1>Produkt wird geladen …</h1>
        <p>Bitte einen Moment warten.</p>
      </div>
    </div>

  </main>

  <!-- =========================
       FOOTER
  ========================= -->

  <footer>
    <div>
      © 2026 DealKira
    </div>

    <div style="margin-top:10px;">
      <a href="impressum.html">Impressum</a>
      <a href="datenschutz.html">Datenschutz</a>
    </div>
  </footer>


  <script>

    /* =========================
       MOBILES MENÜ
    ========================= */

    function toggleMenu() {
      const nav = document.querySelector("nav");

      if (nav.style.display === "flex") {
        nav.style.display = "none";
      } else {
        nav.style.display = "flex";
        nav.style.position = "absolute";
        nav.style.top = "72px";
        nav.style.left = "0";
        nav.style.right = "0";
        nav.style.background = "#000";
        nav.style.flexDirection = "column";
        nav.style.padding = "20px";
        nav.style.gap = "18px";
      }
    }


    /* =========================
       HTML SICHER AUSGEBEN
    ========================= */

    function escapeHtml(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /* =========================
       URL SICHER AUSGEBEN
    ========================= */

    function safeUrl(value) {

      if (!value) {
        return "";
      }

      try {

        const url = new URL(value, window.location.href);

        if (
          url.protocol === "http:" ||
          url.protocol === "https:"
        ) {
          return url.href;
        }

      } catch (error) {
        return "";
      }

      return "";
    }


    /* =========================
       PRODUKT LADEN
    ========================= */

    async function loadProduct() {

      const container =
        document.getElementById("product-container");

      const params =
        new URLSearchParams(window.location.search);

      const productId =
        params.get("id");


      if (!productId) {

        container.innerHTML = `
          <div class="error-box">
            <h1>Produkt nicht gefunden</h1>
            <p>
              Es wurde keine Produkt-ID übergeben.
            </p>

            <a href="tablets.html" class="error-button">
              Zu den Tablets
            </a>
          </div>
        `;

        return;
      }


      try {

        const response =
          await fetch("tablets.json", {
            cache: "no-cache"
          });


        if (!response.ok) {
          throw new Error(
            "tablets.json konnte nicht geladen werden."
          );
        }


        const products =
          await response.json();


        const product =
          products.find(function(item) {

            return String(item.id) === String(productId);

          });


        if (!product) {

          container.innerHTML = `
            <div class="error-box">
              <h1>Produkt konnte nicht gefunden werden</h1>

              <p>
                Das Tablet mit der ID
                <strong>${escapeHtml(productId)}</strong>
                wurde in tablets.json nicht gefunden.
              </p>

              <a href="tablets.html" class="error-button">
                Zu den Tablets
              </a>
            </div>
          `;

          return;
        }


        renderProduct(product);


      } catch (error) {

        console.error(
          "Fehler beim Laden des Tablets:",
          error
        );


        container.innerHTML = `
          <div class="error-box">
            <h1>Fehler beim Laden</h1>

            <p>
              Die Tablet-Daten konnten nicht geladen werden.
              Bitte überprüfe, ob <strong>tablets.json</strong>
              im gleichen Ordner wie diese HTML-Datei liegt.
            </p>

            <a href="tablets.html" class="error-button">
              Zurück zu den Tablets
            </a>
          </div>
        `;

      }
    }


    /* =========================
       PRODUKT DARSTELLEN
    ========================= */

    function renderProduct(product) {

      const container =
        document.getElementById("product-container");


      const brand =
        escapeHtml(product.brand || "");


      const name =
        escapeHtml(product.name || "Tablet");


      const series =
        escapeHtml(product.series || "");


      const image =
        safeUrl(product.image || "");


      let imageHtml = "";

      if (image) {

        imageHtml = `
          <img
            class="product-image"
            src="${escapeHtml(image)}"
            alt="${name}"
            loading="eager"
          >
        `;

      } else {

        imageHtml = `
          <div class="no-image">
            Kein Produktbild verfügbar
          </div>
        `;

      }


      /* =========================
         SHOPS
      ========================= */

      let shopsHtml = "";


      if (
        Array.isArray(product.shops) &&
        product.shops.length > 0
      ) {

        product.shops.forEach(function(shop) {

          if (!shop) {
            return;
          }


          const shopName =
            escapeHtml(
              shop.name || "Shop"
            );


          const price =
            shop.price
              ? escapeHtml(shop.price)
              : "Preis ansehen";


          const link =
            safeUrl(shop.link || "");


          let buttonHtml = "";


          if (link) {

            buttonHtml = `
              <a
                class="shop-button"
                href="${escapeHtml(link)}"
                target="_blank"
                rel="nofollow sponsored noopener noreferrer"
              >
                Gehe zu →
              </a>
            `;

          } else {

            buttonHtml = `
              <div class="no-link">
                Kein Link
              </div>
            `;

          }


          shopsHtml += `
            <div class="shop-row">

              <div class="shop-name">
                ${shopName}
              </div>

              <div class="shop-price">
                ${price}
              </div>

              <div>
                ${buttonHtml}
              </div>

            </div>
          `;

        });

      } else {

        shopsHtml = `
          <div class="no-shops">
            Für dieses Tablet sind derzeit keine Shops
            hinterlegt.
          </div>
        `;

      }


      /* =========================
         GESAMTE PRODUKTSEITE
      ========================= */

      container.innerHTML = `

        <div class="product-box">

          <div class="product-top">

            <div class="product-image-area">
              ${imageHtml}
            </div>


            <div class="product-info">

              ${
                brand
                  ? `
                    <div class="product-brand">
                      ${brand}
                    </div>
                  `
                  : ""
              }


              <h1>
                ${name}
              </h1>


              ${
                series
                  ? `
                    <div class="product-series">
                      ${series}
                    </div>
                  `
                  : ""
              }


              <div class="product-description">
                Vergleiche die verfügbaren Angebote
                für dieses Tablet und finde den passenden
                Shop.
              </div>

            </div>

          </div>


          <div class="comparison">

            <h2>
              Preise vergleichen
            </h2>

            <p class="comparison-intro">
              Angebote verschiedener Shops im Überblick:
            </p>

            <div class="shops">
              ${shopsHtml}
            </div>

          </div>

        </div>

      `;
    }


    /* =========================
       START
    ========================= */

    document.addEventListener(
      "DOMContentLoaded",
      function() {
        loadProduct();
      }
    );

  </script>

</body>
</html>
