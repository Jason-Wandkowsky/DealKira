<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support – DealKira</title>

  <link rel="stylesheet" href="basis.css">
<script src="basis.js"></script>

<style>

    body {
      background: #181818;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    .support-box {
      max-width: 650px;
    }

    .support-box h1 {
      font-size: 48px;
      color: #ffd400;
      margin-bottom: 20px;
    }

    .support-box p {
      font-size: 21px;
      color: #bbb;
    }

    .status {
      margin-top: 25px;
      padding: 15px 22px;
      background: #222;
      border: 1px solid #333;
      border-radius: 10px;
      display: inline-block;
      font-weight: 700;
    }

    @media(max-width:550px) {

      .support-box h1 {
        font-size: 38px;
      }

      .support-box p {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <site-header></site-header>

  <main>

    <div class="support-box">

      <h1>Support</h1>

      <p>
        Der Support-Bereich von DealKira befindet sich derzeit noch in Bearbeitung.
      </p>

      <div class="status">
        🛠️ Noch in Bearbeitung
      </div>

    </div>

  </main>

  <site-footer></site-footer>

</body>
</html>
