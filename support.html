<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support – DealKira</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #181818;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 72px;
      background: #111;
      padding: 0 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo img {
      height: 230px;
      width: auto;
      display: block;
    }

    .back {
      color: #ffd400;
      text-decoration: none;
      font-weight: 700;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    .support-box {
      max-width: 650px;
    }

    .support-box h1 {
      font-size: 48px;
      color: #ffd400;
      margin-bottom: 20px;
    }

    .support-box p {
      font-size: 21px;
      color: #bbb;
    }

    .status {
      margin-top: 25px;
      padding: 15px 22px;
      background: #222;
      border: 1px solid #333;
      border-radius: 10px;
      display: inline-block;
      font-weight: 700;
    }

    footer {
      background: #111;
      text-align: center;
      padding: 20px;
      color: #888;
      font-size: 14px;
    }

    @media(max-width:550px) {
      header {
        height: 68px;
        padding: 0 5%;
      }

      .logo img {
        height: 180px;
      }

      .support-box h1 {
        font-size: 38px;
      }

      .support-box p {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html">
      <div class="logo">
        <img src="20879_nobg (1).png" alt="DealKira">
      </div>
    </a>

    <a href="index.html" class="back">
      ← Zur Startseite
    </a>
  </header>

  <main>

    <div class="support-box">

      <h1>Support</h1>

      <p>
        Der Support-Bereich von DealKira befindet sich derzeit noch in Bearbeitung.
      </p>

      <div class="status">
        🛠️ Noch in Bearbeitung
      </div>

    </div>

  </main>

  <footer>
    © DealKira 2026
  </footer>

</body>
</html>
