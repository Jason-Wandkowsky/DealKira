<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mäuse – DealKira</title>

<link rel="stylesheet" href="basis.css">
<link rel="stylesheet" href="bausteine.css">
<script src="basis.js"></script>

<style>

body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #111;
  min-height: 100vh;
}

/* =========================
   SEITENKOPF
========================= */

.page-header {
  background: linear-gradient(135deg, #111, #222);
  color: white;
  text-align: center;
  padding: 55px 20px;
}

.page-header h1 {
  font-size: 38px;
  margin-bottom: 12px;
}

.page-header h1 span {
  color: #ffd400;
}

.page-header p {
  color: #ccc;
  font-size: 17px;
}

/* =========================
   PRODUKTE / FILTER
========================= */

.products-section {
  max-width: 1100px;
  margin: 45px auto 70px;
  padding: 0 20px;
}

.products-top {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 25px;
}

.filter-button {
  background: #ffd400;
  color: #111;
  border: none;
  border-radius: 10px;
  padding: 12px 22px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: 0.2s;
}

.filter-button:hover {
  transform: translateY(-2px);
}

.filter-message {
  display: none;
  background: #fff;
  border-radius: 12px;
  padding: 15px 18px;
  margin-bottom: 22px;
  text-align: center;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
  color: #555;
}

.filter-message.show {
  display: block;
}

.products {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 22px;
}

.empty-state {
  grid-column: 1 / -1;
  background: white;
  border-radius: 16px;
  padding: 55px 30px;
  text-align: center;
  box-shadow: 0 4px 18px rgba(0,0,0,0.08);
}

.empty-icon {
  font-size: 65px;
  margin-bottom: 20px;
}

.empty-state h2 {
  font-size: 26px;
  margin-bottom: 10px;
}

.empty-state p {
  color: #666;
  font-size: 16px;
}

/* =========================
   TABLET
========================= */

@media (max-width: 800px) {

  .page-header h1 {
    font-size: 32px;
  }
}

/* =========================
   MOBIL
========================= */

@media (max-width: 550px) {

  .page-header {
    padding: 45px 15px;
  }

  .page-header h1 {
    font-size: 28px;
  }

  .products-section {
    margin: 35px auto 50px;
    padding: 0 12px;
  }

  .products-top {
    margin-bottom: 18px;
  }

  .filter-button {
    padding: 10px 17px;
    font-size: 14px;
  }

  .products {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .empty-state {
    padding: 45px 15px;
    border-radius: 13px;
  }

  .empty-icon {
    font-size: 50px;
  }

  .empty-state h2 {
    font-size: 20px;
  }

  .empty-state p {
    font-size: 14px;
  }
}
</style>
</head>

<body>

<site-header></site-header>

<section class="page-header">
  <h1><span>Mäuse</span></h1>
  <p>Computer-Mäuse entdecken und passende Deals finden.</p>
</section>

<section class="products-section">

  <div class="products-top">
    <button class="filter-button" onclick="toggleFilter()">
      ⚙️ Filter
    </button>
  </div>

  <div class="filter-message" id="filterMessage">
    Sobald hier Produkte sind, kannst du nach Marke filtern.
  </div>

  <div class="products" data-kategorie="maeuse">

    <div class="empty-state">

      <div class="empty-icon">🖱️</div>

      <h2>Noch keine Produkte vorhanden</h2>

      <p>
        In dieser Kategorie werden bald passende Produkte und Deals angezeigt.
      </p>

    </div>

  </div>

</section>

<site-footer></site-footer>

  <script src="kategorie.js"></script>

</body>
</html>
