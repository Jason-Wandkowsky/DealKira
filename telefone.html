<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Telefone – DealKira</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    header {
      height: 82px;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
      position: relative;
      z-index: 1000;
    }

    .logo {
      width: 280px;
      height: 65px;
      display: flex;
      align-items: center;
      overflow: visible;
      position: relative;
    }

    .logo img {
      height: 320px;
      width: auto;
      max-width: none;
      display: block;
    }

    .menu-button {
      width: 48px;
      height: 48px;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: .2s;
    }

    .menu-button span {
      width: 23px;
      height: 3px;
      background: #ffd400;
      border-radius: 3px;
      transition: .2s;
    }

    .menu-button:hover {
      background: #252525;
      border-color: #ffd400;
    }

    .menu-button.active span:nth-child(1) {
      transform: translateY(8px) rotate(45deg);
    }

    .menu-button.active span:nth-child(2) {
      opacity: 0;
    }

    .menu-button.active span:nth-child(3) {
      transform: translateY(-8px) rotate(-45deg);
    }

    .menu-panel {
      position: absolute;
      top: 82px;
      right: 6%;
      width: 270px;
      background: #111;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 10px;
      box-shadow: 0 12px 35px rgba(0,0,0,.5);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: .2s;
    }

    .menu-panel.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .menu-panel a {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
      text-decoration: none;
      padding: 14px 15px;
      border-radius: 9px;
      font-weight: 700;
      transition: .2s;
    }

    .menu-panel a:hover {
      background: #222;
      color: #ffd400;
    }

    .menu-icon {
      width: 25px;
      text-align: center;
      font-size: 19px;
    }

    .menu-divider {
      height: 1px;
      background: #333;
      margin: 8px 5px;
    }

    .hero {
      background: #111;
      color: #fff;
      text-align: center;
      padding: 55px 20px 60px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .hero p {
      font-size: 18px;
      color: #ccc;
    }

    .products-section {
      max-width: 1100px;
      margin: 45px auto 70px;
      padding: 0 20px;
    }

    .products-top {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 25px;
    }

    .filter-button {
      background: #ffd400;
      color: #111;
      border: none;
      border-radius: 10px;
      padding: 12px 22px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s;
    }

    .filter-button:hover {
      transform: translateY(-2px);
    }

    .filter-message {
      display: none;
      background: #fff;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 22px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    .filter-message.show {
      display: block;
    }

    .filter-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .filter-group:last-child {
      margin-bottom: 0;
    }

    .filter-option {
      border: 2px solid #ddd;
      background: #fff;
      color: #111;
      border-radius: 9px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s;
    }

    .filter-option:hover {
      border-color: #ffd400;
      transform: translateY(-1px);
    }

    .filter-option.active {
      background: #ffd400;
      border-color: #ffd400;
      color: #111;
    }

    .samsung-series-section,
    .iphone-series-section {
      display: none;
    }

    .samsung-series-section.show,
    .iphone-series-section.show {
      display: block;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2,minmax(0,1fr));
      gap: 22px;
    }

    .product-card {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
      transition: .2s;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0,0,0,.14);
    }

    .product-card.hidden {
      display: none;
    }

    .product-image {
      height: 190px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
      overflow: hidden;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .product-content {
      padding: 22px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .product-content h2 {
      font-size: 23px;
      margin-bottom: 20px;
    }

    .product-button {
      margin-top: auto;
      display: inline-block;
      text-align: center;
      padding: 13px 18px;
      background: #ffd400;
      color: #111;
      text-decoration: none;
      border-radius: 9px;
      font-weight: 700;
      transition: .2s;
    }

    .product-button:hover {
      background: #111;
      color: #ffd400;
    }

    .favorite-button {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,.95);
      box-shadow: 0 3px 12px rgba(0,0,0,.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      z-index: 5;
      transition: .2s;
    }

    .favorite-button:hover {
      transform: scale(1.08);
      background: #fff;
    }

    .favorite-button.active {
      color: #e60023;
    }

    .favorite-button:disabled {
      cursor: wait;
      opacity: .7;
    }

    .loading-message,
    .error-message,
    .empty-message {
      grid-column: 1 / -1;
      background: #fff;
      border-radius: 14px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    .error-message {
      color: #b00020;
    }

    footer {
      background: #111;
      color: #aaa;
      text-align: center;
      padding: 30px 20px;
      font-size: 14px;
    }

    @media(max-width:800px) {
      .logo {
        width: 225px;
      }

      .logo img {
        height: 275px;
      }
    }

    @media(max-width:550px) {
      header {
        padding: 0 5%;
      }

      .logo {
        width: 190px;
        height: 50px;
      }

      .logo img {
        height: 235px;
      }

      .menu-panel {
        right: 5%;
        width: 270px;
      }

      .hero {
        padding: 42px 15px 48px;
      }

      .hero h1 {
        font-size: 30px;
      }

      .hero p {
        font-size: 15px;
      }

      .products-section {
        margin: 35px auto 50px;
        padding: 0 12px;
      }

      .products-top {
        margin-bottom: 18px;
      }

      .filter-button {
        padding: 10px 17px;
        font-size: 14px;
      }

      .filter-message {
        padding: 14px;
      }

      .filter-title {
        font-size: 14px;
      }

      .filter-group {
        gap: 7px;
      }

      .filter-option {
        padding: 8px 11px;
        font-size: 12px;
      }

      .products {
        grid-template-columns: repeat(2,minmax(0,1fr));
        gap: 12px;
      }

      .product-image {
        height: 130px;
        padding: 8px;
      }

      .product-content {
        padding: 14px;
      }

      .product-content h2 {
        font-size: 17px;
        margin-bottom: 15px;
      }

      .product-button {
        padding: 10px 8px;
        font-size: 13px;
      }

      .favorite-button {
        width: 38px;
        height: 38px;
        top: 8px;
        right: 8px;
        font-size: 21px;
      }
    }

    @media(max-width:380px) {
      .logo {
        width: 170px;
      }

      .logo img {
        height: 215px;
      }

      .menu-button {
        width: 45px;
        height: 45px;
      }
    }
  </style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  /* ========================= */
  /* SUPABASE */
  /* ========================= */

  const SUPABASE_URL =
    "https://zniknbouugmgvqkkoamo.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_Jr7OQScG8lgIja_Hav5-mw_B_htFgzI";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ========================= */
  /* PRODUKTE */
  /* ========================= */

  let productsData = [];


  async function loadProducts() {

    const productsContainer =
      document.getElementById("products");

    try {

      const response =
        await fetch("telefone.json", {
          cache: "no-cache"
        });


      if (!response.ok) {
        throw new Error(
          "telefone.json konnte nicht geladen werden."
        );
      }


      productsData =
        await response.json();


      renderProducts();

    } catch (error) {

      console.error(
        "Fehler beim Laden der Telefone:",
        error
      );

      productsContainer.innerHTML = `
        <div class="error-message">
          Die Telefone konnten nicht geladen werden.
          <br><br>
          Bitte prüfe, ob <strong>telefone.json</strong>
          im gleichen Ordner wie <strong>telefone.html</strong>
          liegt.
        </div>
      `;

    }

  }


  function renderProducts() {

    const productsContainer =
      document.getElementById("products");


    productsContainer.innerHTML = "";


    if (!productsData.length) {

      productsContainer.innerHTML = `
        <div class="empty-message">
          Keine Telefone vorhanden.
        </div>
      `;

      return;

    }


    productsData.forEach(function(product) {

      const card =
        document.createElement("article");

      card.className =
        "product-card";


      card.dataset.brand =
        product.brand || "";

      card.dataset.series =
        product.series || "";

      card.dataset.productId =
        product.id || "";

      card.dataset.productName =
        product.name || "";

      card.dataset.productImage =
        product.image || "";

      card.dataset.productPrice =
        product.price || "";

      card.dataset.productShop =
        product.shop || "";

      card.dataset.productLink =
        product.link || "";


      const favoriteButton =
        document.createElement("button");

      favoriteButton.className =
        "favorite-button";

      favoriteButton.type =
        "button";

      favoriteButton.textContent =
        "♡";

      favoriteButton.setAttribute(
        "aria-label",
        "Zu Favoriten hinzufügen"
      );

      favoriteButton.addEventListener(
        "click",
        function() {
          toggleFavorite(favoriteButton);
        }
      );


      const imageContainer =
        document.createElement("div");

      imageContainer.className =
        "product-image";


      const image =
        document.createElement("img");

      image.src =
        product.image || "";

      image.alt =
        product.name || "Telefon";

      image.loading =
        "lazy";


      image.onerror =
        function() {
          this.style.display = "none";
        };


      imageContainer.appendChild(image);


      const content =
        document.createElement("div");

      content.className =
        "product-content";


      const title =
        document.createElement("h2");

      title.textContent =
        product.name || "Telefon";


      const dealButton =
        document.createElement("a");

      dealButton.className =
        "product-button";

      dealButton.textContent =
        "Zum Deal";


      if (product.link) {

        dealButton.href =
          product.link;

        dealButton.target =
          "_blank";

        dealButton.rel =
          "nofollow sponsored noopener";

      } else {

        dealButton.href =
          "#";

        dealButton.addEventListener(
          "click",
          function(event) {
            event.preventDefault();
          }
        );

      }


      content.appendChild(title);
      content.appendChild(dealButton);


      card.appendChild(favoriteButton);
      card.appendChild(imageContainer);
      card.appendChild(content);


      productsContainer.appendChild(card);

    });


    updateFilterButtons();
    applyFilters();

    loadFavorites();

  }


  /* ========================= */
  /* MENÜ */
  /* ========================= */

  function toggleMenu() {

    const menu =
      document.getElementById("menuPanel");

    const button =
      document.getElementById("menuButton");

    menu.classList.toggle("open");
    button.classList.toggle("active");

  }


  function closeMenu() {

    const menu =
      document.getElementById("menuPanel");

    const button =
      document.getElementById("menuButton");

    menu.classList.remove("open");
    button.classList.remove("active");

  }


  document.addEventListener(
    "click",
    function(event) {

      const menu =
        document.getElementById("menuPanel");

      const button =
        document.getElementById("menuButton");


      if (
        !menu.contains(event.target) &&
        !button.contains(event.target)
      ) {
        closeMenu();
      }

    }
  );


  /* ========================= */
  /* FILTER */
  /* ========================= */

  function toggleFilter() {

    const filter =
      document.getElementById("filterMessage");

    filter.classList.toggle("show");

  }


  let activeBrand = null;
  let activeSeries = null;
  let activeIphoneSeries = null;


  function toggleBrandFilter(brand) {

    if (activeBrand === brand) {
      activeBrand = null;
    } else {
      activeBrand = brand;
    }

    activeSeries = null;
    activeIphoneSeries = null;

    updateFilterButtons();
    applyFilters();

  }


  function toggleSeriesFilter(series) {

    if (activeSeries === series) {
      activeSeries = null;
    } else {
      activeSeries = series;
    }

    if (activeSeries) {
      activeBrand = "Samsung";
      activeIphoneSeries = null;
    }

    updateFilterButtons();
    applyFilters();

  }


  function toggleIphoneSeriesFilter(series) {

    if (activeIphoneSeries === series) {
      activeIphoneSeries = null;
    } else {
      activeIphoneSeries = series;
    }

    if (activeIphoneSeries) {
      activeBrand = "iPhone";
      activeSeries = null;
    }

    updateFilterButtons();
    applyFilters();

  }


  function updateFilterButtons() {

    const samsungButton =
      document.getElementById("filterSamsung");

    const iphoneButton =
      document.getElementById("filterIphone");


    const samsungSeriesSection =
      document.getElementById(
        "samsungSeriesSection"
      );

    const iphoneSeriesSection =
      document.getElementById(
        "iphoneSeriesSection"
      );


    samsungButton.classList.toggle(
      "active",
      activeBrand === "Samsung"
    );

    iphoneButton.classList.toggle(
      "active",
      activeBrand === "iPhone"
    );


    samsungSeriesSection.classList.toggle(
      "show",
      activeBrand === "Samsung"
    );

    iphoneSeriesSection.classList.toggle(
      "show",
      activeBrand === "iPhone"
    );


    const samsungSeriesButtons = {
      S: "filterS",
      A: "filterA",
      Z: "filterZ",
      XCover: "filterXCover"
    };


    Object.keys(
      samsungSeriesButtons
    ).forEach(function(series) {

      document
        .getElementById(
          samsungSeriesButtons[series]
        )
        .classList.toggle(
          "active",
          activeSeries === series
        );

    });


    const iphoneSeriesButtons = [
      "SE",
      "11",
      "12",
      "13",
      "14",
      "15",
      "16",
      "17"
    ];


    iphoneSeriesButtons.forEach(
      function(series) {

        document
          .getElementById(
            "filter" + series
          )
          .classList.toggle(
            "active",
            activeIphoneSeries === series
          );

      }
    );

  }


  function applyFilters() {

    const cards =
      document.querySelectorAll(
        ".product-card"
      );


    cards.forEach(function(card) {

      const brand =
        card.dataset.brand;

      const series =
        card.dataset.series;


      let visible = true;


      if (
        activeBrand &&
        brand !== activeBrand
      ) {
        visible = false;
      }


      if (
        visible &&
        activeSeries
      ) {

        if (
          brand !== "Samsung" ||
          series !== activeSeries
        ) {
          visible = false;
        }

      }


      if (
        visible &&
        activeIphoneSeries
      ) {

        if (
          brand !== "iPhone" ||
          series !== activeIphoneSeries
        ) {
          visible = false;
        }

      }


      card.classList.toggle(
        "hidden",
        !visible
      );

    });

  }


  /* ========================= */
  /* USER */
  /* ========================= */

  async function getCurrentUser() {

    const {
      data,
      error
    } =
      await supabaseClient.auth.getUser();


    if (error) {
      return null;
    }


    return data.user;

  }


  /* ========================= */
  /* FAVORITEN */
  /* ========================= */

  async function toggleFavorite(button) {

    button.disabled = true;


    try {

      const user =
        await getCurrentUser();


      if (!user) {

        window.location.href =
          "konto.html";

        return;

      }


      const card =
        button.closest(
          ".product-card"
        );


      const productId =
        card.dataset.productId;

      const productName =
        card.dataset.productName;

      const productImage =
        card.dataset.productImage;

      const productPrice =
        card.dataset.productPrice;

      const productShop =
        card.dataset.productShop;

      const productLink =
        card.dataset.productLink;


      if (
        button.classList.contains("active")
      ) {

        const {
          error
        } =
          await supabaseClient
            .from("favorites")
            .delete()
            .eq(
              "user_id",
              user.id
            )
            .eq(
              "product_id",
              productId
            );


        if (error) {
          throw error;
        }


        button.classList.remove(
          "active"
        );

        button.textContent =
          "♡";

        button.setAttribute(
          "aria-label",
          "Zu Favoriten hinzufügen"
        );

      } else {

        const {
          error
        } =
          await supabaseClient
            .from("favorites")
            .insert({

              user_id:
                user.id,

              product_id:
                productId,

              product_name:
                productName,

              product_image:
                productImage,

              product_price:
                productPrice,

              product_shop:
                productShop,

              product_link:
                productLink

            });


        if (error) {
          throw error;
        }


        button.classList.add(
          "active"
        );

        button.textContent =
          "♥";

        button.setAttribute(
          "aria-label",
          "Aus Favoriten entfernen"
        );

      }

    } catch (error) {

      console.error(
        "Favoriten-Fehler:",
        error
      );

    } finally {

      button.disabled = false;

    }

  }


  async function loadFavorites() {

    const user =
      await getCurrentUser();


    if (!user) {
      return;
    }


    const {
      data,
      error
    } =
      await supabaseClient
        .from("favorites")
        .select("product_id")
        .eq(
          "user_id",
          user.id
        );


    if (error) {

      console.error(
        "Fehler beim Laden der Favoriten:",
        error
      );

      return;

    }


    const favoriteIds =
      new Set(
        data.map(
          item =>
            item.product_id
        )
      );


    document
      .querySelectorAll(
        ".product-card"
      )
      .forEach(
        function(card) {

          const productId =
            card.dataset.productId;

          const button =
            card.querySelector(
              ".favorite-button"
            );


          if (
            favoriteIds.has(
              productId
            )
          ) {

            button.classList.add(
              "active"
            );

            button.textContent =
              "♥";

            button.setAttribute(
              "aria-label",
              "Aus Favoriten entfernen"
            );

          }

        }
      );

  }


  supabaseClient.auth.onAuthStateChange(
    function() {

      setTimeout(
        function() {
          loadFavorites();
        },
        0
      );

    }
  );


  /* ========================= */
  /* START */
  /* ========================= */

  document.addEventListener(
    "DOMContentLoaded",
    function() {

      loadProducts();

    }
  );

</script>

</body>
</html>
