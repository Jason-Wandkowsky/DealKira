<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gehäuse – DealKira</title>

<link rel="stylesheet" href="basis.css">
<link rel="stylesheet" href="bausteine.css">
<script src="basis.js"></script>

</head>

<body>

<site-header></site-header>

<section class="hero">

  <h1>Gehäuse</h1>

  <p>
    PC-Gehäuse für verschiedene Systeme, Komponenten und Setups entdecken
  </p>

</section>

<section class="products-section">

  <div class="products-top">

    <button
      class="filter-button"
      onclick="toggleFilter()"
    >
      ⚙️ Filter
    </button>

  </div>

  <div
    class="filter-message"
    id="filterMessage"
  >
    Der Filter befindet sich noch in Bearbeitung.
  </div>

  <div class="products">

    <div class="empty-state">

      <div class="empty-icon">
        🖥️
      </div>

      <h2>Noch keine Produkte vorhanden</h2>

      <p>
        Hier werden bald passende PC-Gehäuse und Angebote angezeigt.
      </p>

    </div>

  </div>

</section>

<site-footer></site-footer>

</body>
</html>
