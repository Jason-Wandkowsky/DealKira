<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="basis.css">

<style>

.categories-section {
  max-width: 1100px;
  margin: 45px auto 70px;
  padding: 0 20px;
}

.categories {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 22px;
}

.category-card {
  min-height: 210px;
  background: #fff;
  border-radius: 16px;
  text-decoration: none;
  color: #111;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 25px;
  box-shadow: 0 4px 18px rgba(0,0,0,.08);
  transition: .2s;
}

.category-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 8px 24px rgba(0,0,0,.12);
}

.category-icon {
  font-size: 58px;
  margin-bottom: 15px;
}

.category-card h2 {
  font-size: 22px;
  margin-bottom: 7px;
}

.category-card p {
  color: #666;
  font-size: 14px;
}

@media (max-width: 550px) {

  .categories-section {
    margin: 35px auto 50px;
    padding: 0 12px;
  }

  .categories {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .category-card {
    min-height: 175px;
    padding: 15px 8px;
    border-radius: 13px;
  }

  .category-icon {
    font-size: 43px;
    margin-bottom: 10px;
  }

  .category-card h2 {
    font-size: 16px;
  }

  .category-card p {
    font-size: 12px;
  }

}

</style>
</head>

<body>

<site-header></site-header>

<section class="hero">

  <h1>Waschmaschinen <span>&amp; Trockner</span></h1>

  <p>
    Waschmaschinen, Trockner und Waschtrockner entdecken
  </p>

</section>

<section class="categories-section">

  <div class="categories">

    <a href="waschmaschinen.html" class="category-card">

      <div class="category-icon">
        🧺
      </div>

      <h2>Waschmaschinen</h2>

      <p>
        Waschmaschinen für verschiedene Haushalte und Ansprüche
      </p>

    </a>

    <a href="trockner.html" class="category-card">

      <div class="category-icon">
        ♨️
      </div>

      <h2>Trockner</h2>

      <p>
        Wäschetrockner für schnelles und bequemes Trocknen
      </p>

    </a>

    <a href="waschtrockner.html" class="category-card">

      <div class="category-icon">
        🧺
      </div>

      <h2>Waschtrockner</h2>

      <p>
        Waschen und Trocknen kombiniert in einem Gerät
      </p>

    </a>

  </div>

</section>

<site-footer></site-footer>
