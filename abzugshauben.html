<!-- abzugshauben.html -->
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abzugshauben – DealKira</title>

  <link rel="stylesheet" href="basis.css">
<link rel="stylesheet" href="bausteine.css">
<script src="basis.js"></script>

</head>

<body>

  <site-header></site-header>

  <section class="hero">
    <h1><span>Abzugshauben</span></h1>
    <p>Abzugshauben für verschiedene Küchen und Ansprüche entdecken</p>
  </section>

  <main class="products-section">

    <div class="products-top">
      <button class="filter-button" onclick="toggleFilter()">
        ⚙️ Filter
      </button>
    </div>

    <div class="filter-message" id="filterMessage">
      Sobald hier Produkte sind, kannst du nach Marke filtern.
    </div>

    <div class="products" data-kategorie="abzugshauben">

      <div class="empty-state">
        <div class="empty-icon">💨</div>
        <h2>Noch keine Produkte vorhanden</h2>
        <p>Hier werden bald passende Abzugshauben und Angebote angezeigt.</p>
      </div>

    </div>

  </main>

  <site-footer></site-footer>

  <script src="kategorie.js"></script>

</body>
</html>
