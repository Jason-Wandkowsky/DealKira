<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kabel – DealKira</title>

  <link rel="stylesheet" href="basis.css">
<link rel="stylesheet" href="bausteine.css">
<script src="basis.js"></script>

<style>

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
      min-height: 100vh;
    }

    .categories-section {
      max-width: 1100px;
      margin: 45px auto 70px;
      padding: 0 20px;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
    }

    .category-card {
      background: white;
      border-radius: 16px;
      padding: 35px 25px;
      text-align: center;
      text-decoration: none;
      color: #111;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
      transition: 0.2s;
    }

    .category-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 25px rgba(0,0,0,.13);
    }

    .category-icon {
      font-size: 60px;
      margin-bottom: 18px;
    }

    .category-card h2 {
      font-size: 23px;
      margin-bottom: 8px;
    }

    .category-card p {
      color: #666;
      font-size: 15px;
      line-height: 1.5;
    }

    @media (max-width: 550px) {

      .categories-section {
        margin: 35px auto 50px;
        padding: 0 12px;
      }

      .categories {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .category-card {
        padding: 28px 12px;
        border-radius: 13px;
      }

      .category-icon {
        font-size: 45px;
        margin-bottom: 13px;
      }

      .category-card h2 {
        font-size: 18px;
      }

      .category-card p {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <site-header></site-header>

  <section class="page-header">

    <h1><span>Kabel</span></h1>

    <p>
      Kabel für Computer, Zubehör und Setups entdecken
    </p>

  </section>

  <section class="categories-section">

    <div class="categories">

      <a
        href="komponenten-kabel.html"
        class="category-card"
      >
        <div class="category-icon">
          🔌
        </div>

        <h2>
          Komponenten Kabel
        </h2>

        <p>
          Kabel für PC-Komponenten und interne Anschlüsse
        </p>
      </a>

      <a
        href="computer-setup-kabel.html"
        class="category-card"
      >
        <div class="category-icon">
          🖥️
        </div>

        <h2>
          Computer Setup Kabel
        </h2>

        <p>
          Kabel für Monitor, PC, Schreibtisch und Setup
        </p>
      </a>

      <a
        href="kabel-management.html"
        class="category-card"
      >
        <div class="category-icon">
          🧹
        </div>

        <h2>
          Kabel Management
        </h2>

        <p>
          Produkte für ein ordentliches und sauberes Kabelmanagement
        </p>
      </a>

    </div>

  </section>

  <site-footer></site-footer>

</body>
</html>
