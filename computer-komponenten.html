<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Computer-Komponenten – DealKira</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f5f5f5;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    /* HEADER */
    header {
      height: 72px;
      background: #111;
      padding: 0 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
    }

    /* LOGO */
    .logo {
      width: 220px;
      height: 55px;
      display: flex;
      align-items: center;
      overflow: visible;
      position: relative;
    }

    .logo img {
      height: 240px;
      width: auto;
      max-width: none;
      display: block;
    }

    /* HAMBURGER */
    .menu-button {
      width: 48px;
      height: 48px;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    .menu-button span {
      width: 23px;
      height: 3px;
      background: #ffd400;
      border-radius: 3px;
      transition: 0.2s;
    }

    .menu-button:hover {
      background: #252525;
      border-color: #ffd400;
    }

    .menu-button.active span:nth-child(1) {
      transform: translateY(8px) rotate(45deg);
    }

    .menu-button.active span:nth-child(2) {
      opacity: 0;
    }

    .menu-button.active span:nth-child(3) {
      transform: translateY(-8px) rotate(-45deg);
    }

    /* MENÜ */
    .menu-panel {
      position: absolute;
      top: 82px;
      right: 6%;
      width: 270px;
      background: #111;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);

      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: 0.2s;
    }

    .menu-panel.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .menu-panel a {
      display: flex;
      align-items: center;
      gap: 12px;
      color: white;
      text-decoration: none;
      padding: 14px 15px;
      border-radius: 9px;
      font-weight: 700;
    }

    .menu-panel a:hover {
      background: #222;
      color: #ffd400;
    }

    .menu-icon {
      width: 25px;
      text-align: center;
      font-size: 19px;
    }

    .menu-divider {
      height: 1px;
      background: #333;
      margin: 8px 5px;
    }

    /* ZURÜCK-PFEIL */
    .back-button {
      padding: 18px 6% 0;
    }

    .back-button a {
      color: #ffd400;
      text-decoration: none;
      font-size: 42px;
      font-weight: 300;
      line-height: 1;
      display: inline-block;
    }

    .back-button a:hover {
      opacity: .7;
    }

    /* INHALT */
    main {
      padding: 30px 6% 60px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }

    /* KOMPONENTEN */
    .categories {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      max-width: 900px;
    }

    .category {
      background: white;
      border-radius: 14px;
      padding: 25px;
      text-decoration: none;
      color: #111;
      font-size: 19px;
      font-weight: 700;
      border: 1px solid #e5e5e5;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
      transition: 0.2s;
    }

    .category:hover {
      transform: translateY(-2px);
      border-color: #ffd400;
      box-shadow: 0 5px 18px rgba(0,0,0,0.1);
    }

    /* TABLET */
    @media(max-width:800px) {
      header {
        padding: 0 5%;
      }

      .logo {
        width: 180px;
      }

      .logo img {
        height: 210px;
      }

      .menu-panel {
        right: 5%;
      }

      main {
        padding-left: 5%;
        padding-right: 5%;
      }

      .categories {
        grid-template-columns: 1fr;
      }
    }

    /* HANDY */
    @media(max-width:550px) {
      header {
        height: 68px;
        padding: 0 5%;
      }

      .logo {
        width: 145px;
        height: 50px;
      }

      .logo img {
        height: 184px;
      }

      .menu-button {
        width: 45px;
        height: 45px;
      }

      .menu-panel {
        top: 78px;
        right: 5%;
        width: 260px;
      }

      .back-button {
        padding: 16px 5% 0;
      }

      main {
        padding: 25px 5% 50px;
      }

      h1 {
        font-size: 28px;
      }

      .category {
        padding: 22px;
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <header>

    <a href="index.html" class="logo">
      <img src="logo.png" alt="DealKira">
    </a>

    <button
      class="menu-button"
      id="menuButton"
      onclick="toggleMenu()"
      aria-label="Menü öffnen"
      aria-expanded="false"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="menu-panel" id="menuPanel">

      <a href="index.html">
        <span class="menu-icon">🏠</span>
        Startseite
      </a>

      <a href="deals.html">
        <span class="menu-icon">🔥</span>
        Deals
      </a>

      <a href="kategorien.html">
        <span class="menu-icon">📂</span>
        Kategorien
      </a>

      <a href="suche.html">
        <span class="menu-icon">🔍</span>
        Suche
      </a>

      <div class="menu-divider"></div>

      <a href="konto.html">
        <span class="menu-icon">👤</span>
        Konto / Anmelden
      </a>

    </div>

  </header>

  <!-- ZURÜCK -->
  <div class="back-button">
    <a href="computer-kategorien.html">‹</a>
  </div>

  <main>

    <h1>Computer-Komponenten</h1>

    <p class="subtitle">
      Finde passende Angebote für deine Computer-Komponenten.
    </p>

    <div class="categories">

      <a href="#" class="category">
        🖥️ Mainboards
      </a>

      <a href="#" class="category">
        ⚡ Netzteile
      </a>

      <a href="#" class="category">
        🎮 Grafikkarten
      </a>

      <a href="#" class="category">
        💾 RAM
      </a>

      <a href="#" class="category">
        🌀 Lüfter
      </a>

      <a href="#" class="category">
        ❄️ Wasserkühlung
      </a>

      <a href="#" class="category">
        🧠 CPU
      </a>

      <a href="#" class="category">
        🌡️ CPU-Kühler
      </a>

      <a href="#" class="category">
        🖥️ Gehäuse
      </a>

      <a href="#" class="category">
        💿 Speicherplatten
      </a>

    </div>

  </main>

  <script>
    function toggleMenu() {
      const menu = document.getElementById("menuPanel");
      const button = document.getElementById("menuButton");

      const isOpen = menu.classList.toggle("open");

      button.classList.toggle("active");
      button.setAttribute("aria-expanded", isOpen);
    }

    function closeMenu() {
      const menu = document.getElementById("menuPanel");
      const button = document.getElementById("menuButton");

      menu.classList.remove("open");
      button.classList.remove("active");
      button.setAttribute("aria-expanded", "false");
    }

    document.addEventListener("click", function(event) {
      const menu = document.getElementById("menuPanel");
      const button = document.getElementById("menuButton");

      if (!menu.contains(event.target) && !button.contains(event.target)) {
        closeMenu();
      }
    });

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") {
        closeMenu();
      }
    });
  </script>

</body>
</html>
