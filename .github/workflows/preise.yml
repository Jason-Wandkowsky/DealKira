name: Preise aktualisieren

on:
  schedule:
    - cron: "17 4,10,16,22 * * *"   # alle 6 Stunden (ca. 6:17, 12:17, 18:17, 0:17 Uhr)
  workflow_dispatch:        # zusätzlich per Knopfdruck startbar

permissions:
  contents: write
  pages: write

concurrency:
  group: preise
  cancel-in-progress: false

jobs:
  preise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # immer den neuesten Stand holen – wartende Läufe hätten sonst alten Code/alte Preise
          ref: main

      - name: Probelauf nbb-Import (nur Ausgabe, speichert nichts)
        env:
          AWIN_FEED_NOTEBOOKSBILLIGER: ${{ secrets.AWIN_FEED_NOTEBOOKSBILLIGER }}
        run: |
          git fetch -q origin claude/project-thread-3aivux
          git checkout -q FETCH_HEAD -- tools
          python3 tools/trockenlauf.py
