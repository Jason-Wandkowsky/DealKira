name: Preise aktualisieren

on:
  schedule:
    - cron: "17 4,10,16,22 * * *"   # alle 6 Stunden (ca. 6:17, 12:17, 18:17, 0:17 Uhr)
  workflow_dispatch:        # zusätzlich per Knopfdruck startbar

permissions:
  contents: write
  pages: write

concurrency:
  group: preise
  cancel-in-progress: false

jobs:
  preise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preise aus den Awin-Feeds und von eBay holen
        env:
          AWIN_FEED_AOSU: ${{ secrets.AWIN_FEED_AOSU }}
          AWIN_FEED_ANTHBOT: ${{ secrets.AWIN_FEED_ANTHBOT }}
          AWIN_FEED_IMOU: ${{ secrets.AWIN_FEED_IMOU }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python3 tools/preise_aktualisieren.py

      - name: Änderungen speichern
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Keine Preisänderungen."
            exit 0
          fi
          git config user.name "DealKira Preis-Bot"
          git config user.email "actions@users.noreply.github.com"
          git add produkte.json telefone.json tablets.json preise-historie.json deals-auto.json
          git commit -m "Preise automatisch aktualisiert"
          git pull --rebase -q
          git push
          # Website neu veröffentlichen
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds || true
