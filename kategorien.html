<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kategorien – DealKira</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      height: 72px;
      background: #111;
      padding: 0 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 3px 12px rgba(0,0,0,0.25);
    }

    .logo {
      width: 280px;
      height: 65px;
      display: flex;
      align-items: center;
      text-decoration: none;
      overflow: visible;
      position: relative;
    }

    .logo img {
      height: 320px;
      width: auto;
      max-width: none;
      display: block;
    }

    /* =========================
       BURGER BUTTON
    ========================= */

    .menu-button {
      width: 48px;
      height: 48px;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: 0.2s;
    }

    .menu-button span {
      width: 23px;
      height: 3px;
      background: #ffd400;
      border-radius: 3px;
      transition: 0.25s;
    }

    .menu-button:hover {
      background: #252525;
      border-color: #ffd400;
    }

    .menu-button.active span:nth-child(1) {
      transform: translateY(8px) rotate(45deg);
    }

    .menu-button.active span:nth-child(2) {
      opacity: 0;
    }

    .menu-button.active span:nth-child(3) {
      transform: translateY(-8px) rotate(-45deg);
    }

    /* =========================
       BURGER MENU
    ========================= */

    .menu-panel {
      position: absolute;
      top: 82px;
      right: 6%;
      width: 270px;
      background: #111;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);

      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: 0.2s;
    }

    .menu-panel.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .menu-panel a {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
      text-decoration: none;
      padding: 14px 15px;
      border-radius: 9px;
      font-weight: 700;
      transition: 0.2s;
    }

    .menu-panel a:hover {
      background: #222;
      color: #ffd400;
    }

    .menu-icon {
      width: 25px;
      text-align: center;
      font-size: 19px;
    }

    .menu-divider {
      height: 1px;
      background: #333;
      margin: 8px 5px;
    }

    /* =========================
       PAGE HEADER
    ========================= */

    .page-header {
      background: linear-gradient(135deg, #111, #222);
      color: white;
      text-align: center;
      padding: 65px 20px;
    }

    .page-header h1 {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .page-header h1 span {
      color: #ffd400;
    }

    .page-header p {
      color: #bbb;
      font-size: 18px;
    }

    /* =========================
       KATEGORIEN
    ========================= */

    .categories {
      max-width: 1000px;
      margin: 55px auto;
      padding: 0 20px;

      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 25px;
    }

    .category-card {
      min-height: 220px;
      background: white;
      border-radius: 16px;
      text-decoration: none;
      color: #111;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;

      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      transition: 0.2s;
    }

    .category-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.14);
    }

    .category-icon {
      font-size: 65px;
      margin-bottom: 18px;
    }

    .category-card h2 {
      font-size: 24px;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      margin-top: 60px;
      background: #111;
      color: white;
      text-align: center;
      padding: 30px 20px;
    }

    footer strong {
      color: #ffd400;
      font-size: 20px;
    }

    footer p {
      margin-top: 8px;
      color: #888;
    }

    /* =========================
       TABLET
    ========================= */

    @media (max-width: 800px) {

      .logo {
        width: 225px;
      }

      .logo img {
        height: 275px;
      }
    }

    /* =========================
       MOBILE
       Weiterhin 2 nebeneinander
    ========================= */

    @media (max-width: 550px) {

      header {
        height: 68px;
        padding: 0 5%;
      }

      .logo {
        width: 190px;
        height: 50px;
      }

      .logo img {
        height: 235px;
      }

      .menu-button {
        width: 45px;
        height: 45px;
      }

      .menu-panel {
        top: 78px;
        right: 5%;
        width: 260px;
      }

      .categories {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        padding: 0 12px;
        margin: 40px auto;
      }

      .category-card {
        min-height: 180px;
        padding: 15px 8px;
      }

      .category-icon {
        font-size: 48px;
        margin-bottom: 12px;
      }

      .category-card h2 {
        font-size: 17px;
      }

      .page-header {
        padding: 50px 20px;
      }

      .page-header h1 {
        font-size: 36px;
      }

      .page-header p {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <header>

    <!-- Logo → Startseite -->
    <a href="index.html" class="logo">
      <img src="20879_nobg (1).png" alt="DealKira Logo">
    </a>

    <!-- Burger Button -->
    <button
      class="menu-button"
      id="menuButton"
      onclick="toggleMenu()"
      aria-label="Menü öffnen"
      aria-expanded="false"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Burger Menü -->
    <div class="menu-panel" id="menuPanel">

      <a href="konto.html">
        <span class="menu-icon">👤</span>
        Konto / Anmelden
      </a>

      <div class="menu-divider"></div>

      <a href="suche.html">
        <span class="menu-icon">🔍</span>
        Suche
      </a>

      <a href="kategorien.html">
        <span class="menu-icon">📂</span>
        Kategorien
      </a>

      <a href="deals.html">
        <span class="menu-icon">🔥</span>
        Deals
      </a>

      <a href="einstellungen.html">
        <span class="menu-icon">⚙️</span>
        Einstellungen
      </a>

    </div>

  </header>


  <!-- =========================
       PAGE HEADER
  ========================= -->

  <section class="page-header">

    <h1>
      <span>Kategorien</span>
    </h1>

    <p>
      Entdecke Produkte in verschiedenen Kategorien.
    </p>

  </section>


  <!-- =========================
       KATEGORIEN
  ========================= -->

  <section class="categories">

    <!-- Computer -->
    <a
      href="computer-kategorien.html"
      class="category-card"
    >
      <div class="category-icon">
        💻
      </div>

      <h2>
        Computer
      </h2>
    </a>


    <!-- Telefone / Tablets -->
    <a
      href="telefone-tablets.html"
      class="category-card"
    >
      <div class="category-icon">
        📱
      </div>

      <h2>
        Telefone / Tablets &amp; Zubehör
      </h2>
    </a>


    <!-- Haushaltsgeräte -->
    <a
      href="haushaltsgeraete.html"
      class="category-card"
    >
      <div class="category-icon">
        🏠
      </div>

      <h2>
        Haushaltsgeräte
      </h2>
    </a>

  </section>


  <!-- =========================
       FOOTER
  ========================= -->

  <footer>

    <strong>DealKira</strong>

    <p>
      Produkte entdecken. Deals finden. Preise vergleichen.
    </p>

  </footer>


  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script>

    function toggleMenu() {

      const menu = document.getElementById("menuPanel");
      const button = document.getElementById("menuButton");

      const isOpen = menu.classList.toggle("open");

      button.classList.toggle("active");

      button.setAttribute(
        "aria-expanded",
        isOpen
      );
    }


    function closeMenu() {

      const menu = document.getElementById("menuPanel");
      const button = document.getElementById("menuButton");

      menu.classList.remove("open");

      button.classList.remove("active");

      button.setAttribute(
        "aria-expanded",
        "false"
      );
    }


    document.addEventListener("click", function(event) {

      const menu = document.getElementById("menuPanel");
      const button = document.getElementById("menuButton");

      if (
        !menu.contains(event.target) &&
        !button.contains(event.target)
      ) {

        closeMenu();

      }

    });


    document.addEventListener("keydown", function(event) {

      if (event.key === "Escape") {

        closeMenu();

      }

    });

  </script>

</body>
</html>
