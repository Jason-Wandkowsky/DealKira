<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kategorien – DealKira</title>

  <link rel="stylesheet" href="basis.css">
<script src="basis.js"></script>

<style>

    /* =========================
       PAGE HEADER
    ========================= */

    .page-header {
      background: linear-gradient(135deg, #111, #222);
      color: white;
      text-align: center;
      padding: 65px 20px;
    }

    .page-header h1 {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .page-header h1 span {
      color: #ffd400;
    }

    .page-header p {
      color: #bbb;
      font-size: 18px;
    }

    /* =========================
       KATEGORIEN
    ========================= */

    .categories {
      max-width: 1000px;
      margin: 55px auto;
      padding: 0 20px;

      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 25px;
    }

    .category-card {
      min-height: 220px;
      background: white;
      border-radius: 16px;
      text-decoration: none;
      color: #111;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;

      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      transition: 0.2s;
    }

    .category-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.14);
    }

    .category-icon {
      font-size: 65px;
      margin-bottom: 18px;
    }

    .category-card h2 {
      font-size: 24px;
    }

    /* =========================
       MOBILE
       Weiterhin 2 nebeneinander
    ========================= */

    @media (max-width: 550px) {

      .categories {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        padding: 0 12px;
        margin: 40px auto;
      }

      .category-card {
        min-height: 180px;
        padding: 15px 8px;
      }

      .category-icon {
        font-size: 48px;
        margin-bottom: 12px;
      }

      .category-card h2 {
        font-size: 17px;
      }

      .page-header {
        padding: 50px 20px;
      }

      .page-header h1 {
        font-size: 36px;
      }

      .page-header p {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <site-header></site-header>

  <!-- =========================
       PAGE HEADER
  ========================= -->

  <section class="page-header">

    <h1>
      <span>Kategorien</span>
    </h1>

    <p>
      Entdecke Produkte in verschiedenen Kategorien.
    </p>

  </section>

  <!-- =========================
       KATEGORIEN
  ========================= -->

  <section class="categories">

    <!-- Computer -->
    <a
      href="computer-kategorien.html"
      class="category-card"
    >
      <div class="category-icon">
        💻
      </div>

      <h2>
        Computer
      </h2>
    </a>

    <!-- Telefone / Tablets -->
    <a
      href="telefone-tablets.html"
      class="category-card"
    >
      <div class="category-icon">
        📱
      </div>

      <h2>
        Telefone / Tablets &amp; Zubehör
      </h2>
    </a>

    <!-- Haushaltsgeräte -->
    <a
      href="haushaltsgeraete.html"
      class="category-card"
    >
      <div class="category-icon">
        🏠
      </div>

      <h2>
        Haushaltsgeräte
      </h2>
    </a>

  </section>

  <!-- =========================
       FOOTER
  ========================= -->

  <site-footer></site-footer>

</body>
</html>
