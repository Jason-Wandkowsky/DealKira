<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kabel – DealKira</title>

  <link rel="stylesheet" href="basis.css">
<link rel="stylesheet" href="bausteine.css?v=20261004b">
<script src="basis.js"></script>

</head>

<body>

  <site-header></site-header>

  <section class="hero">

    <h1><span>Kabel</span></h1>

    <p>
      Kabel für Smartphones, Tablets und verschiedene Anschlüsse entdecken
    </p>

  </section>

  <section class="products-section">

    <div class="products-top">

      <button
        class="filter-button"
        onclick="toggleFilter()"
      >
        ⚙️ Filter
      </button>

    </div>

    <div
      class="filter-message"
      id="filterMessage"
    >
      Sobald hier Produkte sind, kannst du nach Marke filtern.
    </div>

    <div class="products" data-kategorie="telefon-kabel">

      <div class="empty-state">

        <div class="empty-icon">
          🔌
        </div>

        <h2>
          Noch keine Produkte vorhanden
        </h2>

        <p>
          Hier werden bald passende Kabel und Angebote angezeigt.
        </p>

      </div>

    </div>

  </section>

  <site-footer></site-footer>

  <script src="kategorie.js?v=20261004b"></script>

</body>
</html>
