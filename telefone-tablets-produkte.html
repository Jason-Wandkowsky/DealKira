<!DOCTYPE html>
<html lang="de">
<head>

  <link rel="stylesheet" href="basis.css">
<link rel="stylesheet" href="bausteine.css?v=20261004b">
<script src="basis.js"></script>

<style>

    .categories-section {
      max-width: 1100px;
      margin: 45px auto 70px;
      padding: 0 20px;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
    }

    .category-card {
      background: #fff;
      border-radius: 16px;
      padding: 30px;
      text-decoration: none;
      color: #111;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
      transition: 0.2s;
      min-height: 190px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .category-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
    }

    .category-icon {
      font-size: 55px;
      margin-bottom: 18px;
    }

    .category-card h2 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .category-card p {
      color: #666;
      font-size: 15px;
      line-height: 1.5;
    }

    @media (max-width: 550px) {

      .categories-section {
        margin: 35px auto 50px;
        padding: 0 12px;
      }

      .categories {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .category-card {
        padding: 22px 15px;
        min-height: 180px;
        border-radius: 13px;
      }

      .category-icon {
        font-size: 45px;
        margin-bottom: 14px;
      }

      .category-card h2 {
        font-size: 19px;
      }

      .category-card p {
        font-size: 13px;
      }

    }

  </style>
</head>

<body>

  <site-header></site-header>

  <section class="hero">

    <h1>Telefone / Tablets</h1>

    <p>
      Smartphones und Tablets für verschiedene Ansprüche entdecken
    </p>

  </section>

  <main class="categories-section">

    <div class="categories">

      <a href="telefone.html" class="category-card">

        <div class="category-icon">
          📱
        </div>

        <h2>Telefone</h2>

        <p>
          Smartphones verschiedener Marken, Preisklassen und Ausstattungen entdecken.
        </p>

      </a>

      <a href="tablets.html" class="category-card">

        <div class="category-icon">
          📲
        </div>

        <h2>Tablets</h2>

        <p>
          Tablets für Arbeit, Unterhaltung, Gaming und Alltag entdecken.
        </p>

      </a>

    </div>

  </main>

  <site-footer></site-footer>
