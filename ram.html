<title>RAM – DealKira</title><style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #111;
}

/* HEADER */
header {
  height: 72px;
  background: #111;
  padding: 0 6%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 1000;
  box-shadow: 0 3px 12px rgba(0,0,0,0.2);
}

.logo {
  width: 220px;
  height: 55px;
  display: flex;
  align-items: center;
  overflow: hidden;
}

.logo img {
  width: 240px;
  height: auto;
  display: block;
}

/* MENU BUTTON */
.menu-button {
  width: 48px;
  height: 48px;
  background: #1c1c1c;
  border: 1px solid #333;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  cursor: pointer;
  transition: 0.2s;
}

.menu-button span {
  width: 23px;
  height: 3px;
  background: #ffd400;
  border-radius: 3px;
  transition: 0.2s;
}

.menu-button:hover {
  background: #252525;
  border-color: #ffd400;
}

/* X */
.menu-button.active span:nth-child(1) {
  transform: translateY(8px) rotate(45deg);
}

.menu-button.active span:nth-child(2) {
  opacity: 0;
}

.menu-button.active span:nth-child(3) {
  transform: translateY(-8px) rotate(-45deg);
}

/* MENU PANEL */
.menu-panel {
  position: absolute;
  top: 82px;
  right: 6%;
  width: 270px;
  background: #111;
  border: 1px solid #333;
  border-radius: 14px;
  padding: 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  opacity: 0;
  visibility: hidden;
  transform: translateY(-10px);
  transition: 0.2s;
}

.menu-panel.open {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.menu-panel a {
  display: flex;
  align-items: center;
  gap: 12px;
  color: white;
  text-decoration: none;
  padding: 14px 15px;
  border-radius: 9px;
  font-weight: 700;
  transition: 0.2s;
}

.menu-panel a:hover {
  background: #222;
  color: #ffd400;
}

.menu-icon {
  width: 25px;
  text-align: center;
  font-size: 19px;
}

.menu-divider {
  height: 1px;
  background: #333;
  margin: 8px 5px;
}

/* PAGE HEADER */
.page-header {
  background: linear-gradient(135deg, #111, #222);
  color: white;
  text-align: center;
  padding: 55px 20px;
}

.page-header h1 {
  margin: 0 0 10px;
  font-size: 38px;
}

.page-header h1 span {
  color: #ffd400;
}

.page-header p {
  margin: 0;
  color: #ccc;
  font-size: 16px;
}

/* EMPTY STATE */
.empty-state {
  max-width: 700px;
  margin: 70px auto;
  padding: 55px 30px;
  background: white;
  border-radius: 16px;
  text-align: center;
  box-shadow: 0 4px 18px rgba(0,0,0,0.08);
}

.empty-icon {
  font-size: 65px;
  margin-bottom: 20px;
}

.empty-state h2 {
  font-size: 26px;
  margin: 0 0 10px;
}

.empty-state p {
  color: #666;
  font-size: 16px;
  margin: 0;
}

/* FOOTER */
footer {
  margin-top: 100px;
  background: #111;
  color: white;
  text-align: center;
  padding: 30px 20px;
}

footer strong {
  color: #ffd400;
  font-size: 20px;
}

footer p {
  color: #aaa;
  margin-bottom: 0;
}

/* MOBILE */
@media (max-width: 800px) {
  .logo {
    width: 210px;
  }

  .logo img {
    width: 230px;
  }

  .menu-panel {
    right: 5%;
  }
}

@media (max-width: 550px) {
  header {
    padding: 0 5%;
  }

  .logo {
    width: 184px;
  }

  .logo img {
    width: 210px;
  }

  .menu-button {
    width: 45px;
    height: 45px;
  }

  .menu-panel {
    width: 90%;
    right: 5%;
  }

  .page-header {
    padding: 45px 20px;
  }

  .page-header h1 {
    font-size: 32px;
  }

  .empty-state {
    margin: 50px 5%;
    padding: 45px 20px;
  }
}

</header><section class="page-header">
  <h1><span>RAM</span></h1>
  <p>Arbeitsspeicher für Computer und Gaming-PCs.</p>
</section><section class="empty-state">
  <div class="empty-icon">🧠</div>
  <h2>Noch keine Produkte vorhanden</h2>

    In dieser Kategorie werden bald passende Produkte und Deals angezeigt.

  <p>Produkte entdecken. Deals finden. Preise vergleichen.</p>
</footer><script>
function toggleMenu() {
  const menu = document.getElementById("menuPanel");
  const button = document.getElementById("menuButton");

  const isOpen = menu.classList.toggle("open");

  button.classList.toggle("active");
  button.setAttribute("aria-expanded", isOpen);
}

function closeMenu() {
  const menu = document.getElementById("menuPanel");
  const button = document.getElementById("menuButton");

  menu.classList.remove("open");
  button.classList.remove("active");
  button.setAttribute("aria-expanded", "false");
}

document.addEventListener("click", function(event) {
  const menu = document.getElementById("menuPanel");
  const button = document.getElementById("menuButton");

  if (!menu.contains(event.target) && !button.contains(event.target)) {
    closeMenu();
  }
});

document.addEventListener("keydown", function(event) {
  if (event.key === "Escape") {
    closeMenu();
  }
});
</script></body>
