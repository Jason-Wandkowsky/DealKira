<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DealKira – Bessere Deals finden</title>
  <meta name="description" content="DealKira hilft dir dabei, interessante Angebote und gute Preise schneller zu entdecken.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #181818;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      height: 72px;
      background: #111;
      padding: 0 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
    }

    .logo {
      width: 280px;
      height: 65px;
      display: flex;
      align-items: center;
      overflow: visible;
      position: relative;
    }

    .logo img {
      height: 320px;
      width: auto;
      max-width: none;
      display: block;
    }

    /* =========================
       BURGER BUTTON
    ========================= */

    .menu-button {
      width: 48px;
      height: 48px;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 10px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;

      cursor: pointer;
      transition: 0.2s;
    }

    .menu-button span {
      width: 23px;
      height: 3px;
      background: #ffd400;
      border-radius: 3px;
      transition: 0.2s;
    }

    .menu-button:hover {
      background: #252525;
      border-color: #ffd400;
    }

    /* X wenn geöffnet */

    .menu-button.active span:nth-child(1) {
      transform: translateY(8px) rotate(45deg);
    }

    .menu-button.active span:nth-child(2) {
      opacity: 0;
    }

    .menu-button.active span:nth-child(3) {
      transform: translateY(-8px) rotate(-45deg);
    }

    /* =========================
       BURGER MENU
    ========================= */

    .menu-panel {
      position: absolute;
      top: 82px;
      right: 6%;

      width: 270px;

      background: #111;
      border: 1px solid #333;
      border-radius: 14px;

      padding: 10px;

      box-shadow: 0 12px 35px rgba(0,0,0,0.5);

      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);

      transition: 0.2s;
    }

    .menu-panel.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .menu-panel a {
      display: flex;
      align-items: center;

      gap: 12px;

      color: #fff;
      text-decoration: none;

      padding: 14px 15px;

      border-radius: 9px;

      font-weight: 700;

      transition: 0.2s;
    }

    .menu-panel a:hover {
      background: #222;
      color: #ffd400;
    }

    .menu-icon {
      width: 25px;
      text-align: center;
      font-size: 19px;
    }

    .menu-divider {
      height: 1px;
      background: #333;
      margin: 8px 5px;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      flex: 1;

      display: flex;
      align-items: flex-start;
      justify-content: center;

      text-align: center;

      padding: 55px 6% 50px;
    }

    .hero-content {
      max-width: 850px;
      width: 100%;
    }

    .hero h1 {
      font-size: 58px;
      line-height: 1.1;

      margin-bottom: 14px;

      font-weight: 800;
      color: #fff;
    }

    .hero h1 span {
      color: #ffd400;
    }

    .hero p {
      font-size: 21px;
      color: #bdbdbd;

      max-width: 650px;

      margin: 0 auto 28px;
    }

    /* =========================
       SHORTCUTS
    ========================= */

    .shortcuts {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;

      margin-top: 5px;
    }

    .shortcut {
      min-width: 180px;

      padding: 14px 20px;

      background: #222;
      border: 1px solid #333;

      border-radius: 10px;

      color: #fff;
      text-decoration: none;

      font-size: 16px;
      font-weight: 700;

      transition: 0.2s;
    }

    .shortcut:hover {
      background: #ffd400;
      color: #111;
      border-color: #ffd400;

      transform: translateY(-2px);
    }

    /* Deals entdecken bleibt gelb */

    .shortcut.primary {
      background: #ffd400;
      border-color: #ffd400;
      color: #111;
    }

    .shortcut.primary:hover {
      background: #111;
      color: #ffd400;
      border-color: #ffd400;
    }

    .shortcut-icon {
      margin-right: 7px;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      background: #111;

      border-top: 1px solid #292929;

      padding: 18px 6%;

      display: flex;
      justify-content: center;
      align-items: center;

      gap: 22px;

      flex-wrap: wrap;
    }

    .footer-copy {
      color: #888;
      font-size: 14px;
    }

    .footer-separator {
      color: #444;
    }

    .footer-support {
      color: #fff;

      text-decoration: none;

      font-weight: 700;
      font-size: 14px;

      transition: 0.2s;
    }

    .footer-support:hover {
      color: #ffd400;
    }

    /* =========================
       TABLET
    ========================= */

    @media (max-width: 800px) {

      .logo {
        width: 225px;
      }

      .logo img {
        height: 275px;
      }

      .hero {
        padding: 45px 5% 40px;
      }

      .hero h1 {
        font-size: 46px;
      }

      .hero p {
        font-size: 19px;
      }

      .shortcut {
        min-width: 170px;
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 550px) {

      header {
        height: 68px;
        padding: 0 5%;
      }

      .logo {
        width: 190px;
        height: 50px;
      }

      .logo img {
        height: 235px;
      }

      .menu-button {
        width: 45px;
        height: 45px;
      }

      .menu-panel {
        top: 78px;
        right: 5%;
        width: 260px;
      }

      .hero {
        padding: 35px 5% 35px;
      }

      .hero h1 {
        font-size: 37px;
      }

      .hero p {
        font-size: 18px;
        margin-bottom: 25px;
      }

      .shortcuts {
        flex-direction: column;
        gap: 10px;
      }

      .shortcut {
        width: 100%;
      }

      footer {
        padding: 17px 5%;
        gap: 10px;
      }

      .footer-copy,
      .footer-support {
        font-size: 13px;
      }

      .footer-separator {
        display: none;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <header>

    <a href="index.html" class="logo">
      <img src="20879_nobg (1).png" alt="DealKira">
    </a>

    <button
      class="menu-button"
      id="menuButton"
      onclick="toggleMenu()"
      aria-label="Menü öffnen"
      aria-expanded="false"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- =========================
         BURGER MENU
    ========================= -->

    <div class="menu-panel" id="menuPanel">

      <!-- Konto ganz oben -->

      <a href="konto.html">
        <span class="menu-icon">👤</span>
        Konto / Anmelden
      </a>

      <!-- Trennlinie -->

      <div class="menu-divider"></div>

      <!-- Suche -->

      <a href="suche.html">
        <span class="menu-icon">🔍</span>
        Suche
      </a>

      <!-- Kategorien -->

      <a href="kategorien.html">
        <span class="menu-icon">📂</span>
        Kategorien
      </a>

      <!-- Deals -->

      <a href="deals.html">
        <span class="menu-icon">🔥</span>
        Deals
      </a>

      <!-- Einstellungen -->

      <a href="einstellungen.html">
        <span class="menu-icon">⚙️</span>
        Einstellungen
      </a>

    </div>

  </header>


  <!-- =========================
       STARTSEITE
  ========================= -->

  <main class="hero">

    <div class="hero-content">

      <h1>
        Finde bessere <span>Deals.</span>
      </h1>

      <p>
        DealKira hilft dir dabei, interessante Angebote und gute Preise schneller zu entdecken.
      </p>


      <!-- =========================
           SHORTCUTS
      ========================= -->

      <div class="shortcuts">

        <a href="deals.html" class="shortcut primary">
          <span class="shortcut-icon">🔥</span>
          Deals entdecken
        </a>

        <a href="suche.html" class="shortcut">
          <span class="shortcut-icon">🔍</span>
          Suche
        </a>

        <a href="kategorien.html" class="shortcut">
          <span class="shortcut-icon">📂</span>
          Kategorien
        </a>

      </div>

    </div>

  </main>


  <!-- =========================
       FOOTER
  ========================= -->

  <footer>

    <span class="footer-copy">
      © DealKira 2026
    </span>

    <span class="footer-separator">
      |
    </span>

    <a href="support.html" class="footer-support">
      Support
    </a>

  </footer>


  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script>

    function toggleMenu() {

      const menu = document.getElementById("menuPanel");
      const button = document.getElementById("menuButton");

      const isOpen = menu.classList.toggle("open");

      button.classList.toggle("active");

      button.setAttribute(
        "aria-expanded",
        isOpen
      );
    }


    function closeMenu() {

      const menu = document.getElementById("menuPanel");
      const button = document.getElementById("menuButton");

      menu.classList.remove("open");

      button.classList.remove("active");

      button.setAttribute(
        "aria-expanded",
        "false"
      );
    }


    /* Menü schließen, wenn außerhalb geklickt wird */

    document.addEventListener("click", function(event) {

      const menu = document.getElementById("menuPanel");
      const button = document.getElementById("menuButton");

      if (
        !menu.contains(event.target) &&
        !button.contains(event.target)
      ) {

        closeMenu();

      }

    });


    /* ESC schließt Menü */

    document.addEventListener("keydown", function(event) {

      if (event.key === "Escape") {

        closeMenu();

      }

    });

  </script>

</body>
</html>
