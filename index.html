<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DealKira – Gute Deals entdecken</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #181818;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    /* HEADER */
    header {
      height: 72px;
      background: #111;
      padding: 0 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
    }

    /* LOGO */
    .logo {
      width: 250px;
      height: 60px;
      display: flex;
      align-items: center;
      overflow: visible;
      position: relative;
    }

    .logo img {
      height: 280px;
      width: auto;
      max-width: none;
      display: block;
    }

    /* HAMBURGER */
    .menu-button {
      width: 48px;
      height: 48px;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    .menu-button span {
      width: 23px;
      height: 3px;
      background: #ffd400;
      border-radius: 3px;
      transition: 0.2s;
    }

    .menu-button:hover {
      background: #252525;
      border-color: #ffd400;
    }

    .menu-button.active span:nth-child(1) {
      transform: translateY(8px) rotate(45deg);
    }

    .menu-button.active span:nth-child(2) {
      opacity: 0;
    }

    .menu-button.active span:nth-child(3) {
      transform: translateY(-8px) rotate(-45deg);
    }

    /* MENÜ */
    .menu-panel {
      position: absolute;
      top: 82px;
      right: 6%;
      width: 270px;
      background: #111;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);

      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: 0.2s;
    }

    .menu-panel.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .menu-panel a {
      display: flex;
      align-items: center;
      gap: 12px;
      color: white;
      text-decoration: none;
      padding: 14px 15px;
      border-radius: 9px;
      font-weight: 700;
    }

    .menu-panel a:hover {
      background: #222;
      color: #ffd400;
    }

    .menu-icon {
      width: 25px;
      text-align: center;
      font-size: 19px;
    }

    .menu-divider {
      height: 1px;
      background: #333;
      margin: 8px 5px;
    }

    /* STARTSEITE */
    .hero {
      min-height: calc(100vh - 72px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 6%;
    }

    .hero-content {
      max-width: 850px;
    }

    .hero h1 {
      font-size: 58px;
      line-height: 1.1;
      margin-bottom: 22px;
      font-weight: 800;
      color: #fff;
    }

    .hero h1 span {
      color: #ffd400;
    }

    .hero p {
      font-size: 21px;
      color: #bdbdbd;
      max-width: 650px;
      margin: 0 auto 35px;
    }

    /* BUTTON */
    .hero-button {
      display: inline-block;
      background: #ffd400;
      color: #111;
      text-decoration: none;
      padding: 15px 30px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 800;
      border: 2px solid #ffd400;
      transition: 0.2s;
    }

    .hero-button:hover {
      background: #111;
      color: #ffd400;
    }

    /* FLAMME */
    .flame {
      display: inline-block;
      transform-origin: bottom center;
      animation: flameBurn 0.55s ease-in-out infinite;
    }

    @keyframes flameBurn {
      0% {
        transform: translateY(0) scale(1, 1) rotate(-2deg);
      }

      15% {
        transform: translateY(-1px) scale(1.08, 0.94) rotate(3deg);
      }

      30% {
        transform: translateY(0) scale(0.94, 1.08) rotate(-4deg);
      }

      45% {
        transform: translateY(-2px) scale(1.06, 0.96) rotate(2deg);
      }

      60% {
        transform: translateY(0) scale(0.96, 1.06) rotate(-3deg);
      }

      75% {
        transform: translateY(-1px) scale(1.08, 0.94) rotate(4deg);
      }

      90% {
        transform: translateY(0) scale(0.95, 1.05) rotate(-2deg);
      }

      100% {
        transform: translateY(0) scale(1, 1) rotate(2deg);
      }
    }

    /* TABLET */
    @media(max-width:800px) {

      header {
        padding: 0 5%;
      }

      .logo {
        width: 205px;
      }

      .logo img {
        height: 245px;
      }

      .menu-panel {
        right: 5%;
      }

      .hero {
        padding: 50px 5%;
      }

      .hero h1 {
        font-size: 46px;
      }

      .hero p {
        font-size: 19px;
      }
    }

    /* HANDY */
    @media(max-width:550px) {

      header {
        height: 68px;
        padding: 0 5%;
      }

      .logo {
        width: 170px;
        height: 50px;
      }

      .logo img {
        height: 215px;
      }

      .menu-button {
        width: 45px;
        height: 45px;
      }

      .menu-panel {
        top: 78px;
        right: 5%;
        width: 260px;
      }

      .hero {
        min-height: calc(100vh - 68px);
        padding: 40px 5%;
      }

      .hero h1 {
        font-size: 37px;
      }

      .hero p {
        font-size: 18px;
        margin-bottom: 30px;
      }

      .hero-button {
        font-size: 17px;
        padding: 14px 25px;
      }
    }
  </style>
</head>

<body>

  <header>

    <a href="index.html" class="logo">
      <img src="20879_nobg (1).png" alt="DealKira">
    </a>

    <button
      class="menu-button"
      id="menuButton"
      onclick="toggleMenu()"
      aria-label="Menü öffnen"
      aria-expanded="false"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="menu-panel" id="menuPanel">

      <a href="index.html">
        <span class="menu-icon">🏠</span>
        Startseite
      </a>

      <a href="deals.html">
        <span class="menu-icon">🔥</span>
        Deals
      </a>

      <a href="kategorien.html">
        <span class="menu-icon">📂</span>
        Kategorien
      </a>

      <a href="suche.html">
        <span class="menu-icon">🔍</span>
        Suche
      </a>

      <div class="menu-divider"></div>

      <a href="konto.html">
        <span class="menu-icon">👤</span>
        Konto / Anmelden
      </a>

    </div>

  </header>

  <main class="hero">

    <div class="hero-content">

      <h1>
        Finde bessere <span>Deals.</span>
      </h1>

      <p>
        DealKira hilft dir dabei, interessante Angebote
        und gute Preise schneller zu entdecken.
      </p>

      <a href="deals.html" class="hero-button">
        <span class="flame">🔥</span> Deals entdecken
      </a>

    </div>

  </main>

  <script>
    function toggleMenu() {
      const menu = document.getElementById("menuPanel");
      const button = document.getElementById("menuButton");

      const isOpen = menu.classList.toggle("open");

      button.classList.toggle("active");
      button.setAttribute("aria-expanded", isOpen);
    }

    function closeMenu() {
      const menu = document.getElementById("menuPanel");
      const button = document.getElementById("menuButton");

      menu.classList.remove("open");
      button.classList.remove("active");
      button.setAttribute("aria-expanded", "false");
    }

    document.addEventListener("click", function(event) {
      const menu = document.getElementById("menuPanel");
      const button = document.getElementById("menuButton");

      if (!menu.contains(event.target) && !button.contains(event.target)) {
        closeMenu();
      }
    });

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") {
        closeMenu();
      }
    });
  </script>

</body>
</html>
