<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="DealKira – Produkte entdecken, Preise vergleichen und bessere Deals finden."
  >

  <meta name="theme-color" content="#111111">

  <title>DealKira – Bessere Deals finden</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: white;
      min-height: 100vh;
    }


    /* =========================
       HEADER
    ========================== */

    header {
      height: 72px;
      background: #111;
      padding: 0 6%;

      display: flex;
      justify-content: space-between;
      align-items: center;

      position: relative;
      z-index: 1000;

      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
    }


    /* =========================
       LOGO
    ========================== */

    .logo {
      width: 220px;
      height: 55px;

      display: flex;
      align-items: center;

      overflow: visible;
      position: relative;
    }

    .logo img {
      height: 240px;
      width: auto;
      max-width: none;

      display: block;

      transform-origin: left center;
    }


    /* =========================
       HAMBURGER BUTTON
    ========================== */

    .menu-button {
      width: 48px;
      height: 48px;

      background: #1c1c1c;

      border: 1px solid #333;
      border-radius: 10px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      gap: 5px;

      cursor: pointer;

      transition: 0.2s;

      position: relative;
      z-index: 1100;
    }

    .menu-button:hover {
      background: #252525;
      border-color: #ffd400;
    }

    .menu-button span {
      width: 23px;
      height: 3px;

      background: #ffd400;

      border-radius: 3px;

      transition: 0.25s;
    }


    /* =========================
       MENU ANIMATION
    ========================== */

    .menu-button.active span:nth-child(1) {
      transform: translateY(8px) rotate(45deg);
    }

    .menu-button.active span:nth-child(2) {
      opacity: 0;
    }

    .menu-button.active span:nth-child(3) {
      transform: translateY(-8px) rotate(-45deg);
    }


    /* =========================
       MENU PANEL
    ========================== */

    .menu-panel {
      position: absolute;

      top: 82px;
      right: 6%;

      width: 270px;

      background: #111;

      border: 1px solid #333;
      border-radius: 14px;

      padding: 10px;

      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);

      opacity: 0;
      visibility: hidden;

      transform: translateY(-10px);

      transition: 0.2s ease;
    }

    .menu-panel.open {
      opacity: 1;
      visibility: visible;

      transform: translateY(0);
    }

    .menu-panel a {
      display: flex;
      align-items: center;

      gap: 12px;

      color: white;

      text-decoration: none;

      padding: 14px 15px;

      border-radius: 9px;

      font-weight: 700;

      transition: 0.2s;
    }

    .menu-panel a:hover {
      background: #222;
      color: #ffd400;
    }

    .menu-icon {
      width: 25px;

      text-align: center;

      font-size: 19px;
    }

    .menu-divider {
      height: 1px;

      background: #333;

      margin: 8px 5px;
    }


    /* =========================
       STARTSEITE
    ========================== */

    .hero {
      min-height: calc(100vh - 72px);

      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: center;

      text-align: center;

      padding: 40px 20px 80px;

      background:
        radial-gradient(
          circle at center,
          #242424 0%,
          #181818 45%,
          #111 100%
        );
    }


    .hero h1 {
      font-size: clamp(42px, 7vw, 78px);

      line-height: 1.05;

      margin-bottom: 22px;

      font-weight: 900;

      letter-spacing: -2px;
    }

    .hero h1 span {
      color: #ffd400;
    }


    .hero p {
      max-width: 700px;

      font-size: clamp(17px, 2vw, 21px);

      line-height: 1.6;

      color: #d6d6d6;
    }


    /* =========================
       FOOTER
    ========================== */

    footer {
      background: #0b0b0b;

      color: #777;

      text-align: center;

      padding: 25px 20px;
    }

    footer .footer-logo {
      color: white;

      font-size: 22px;

      font-weight: 900;

      margin-bottom: 8px;
    }

    footer .footer-logo span {
      color: #ffd400;
    }

    footer p {
      font-size: 13px;
    }


    /* =========================
       RESPONSIVE
    ========================== */

    @media (max-width: 800px) {

      header {
        padding: 0 5%;
      }

      .logo {
        width: 180px;
      }

      .logo img {
        height: 210px;
      }

      .menu-panel {
        right: 5%;
      }

    }


    @media (max-width: 550px) {

      header {
        height: 68px;
        padding: 0 5%;
      }

      .logo {
        width: 145px;
        height: 50px;
      }

      .logo img {
        height: 184px;
      }

      .menu-button {
        width: 45px;
        height: 45px;
      }

      .menu-panel {
        top: 78px;
        right: 5%;

        width: 260px;
      }

      .hero {
        min-height: calc(100vh - 68px);

        padding: 30px 20px 60px;
      }

      .hero h1 {
        letter-spacing: -1px;
      }

    }

  </style>
</head>


<body>


  <!-- =========================
       HEADER
  ========================== -->

  <header>

    <div class="logo">

      <img
        src="20879_nobg (1).png"
        alt="DealKira Logo"
      >

    </div>


    <!-- HAMBURGER -->

    <button
      class="menu-button"
      id="menuButton"
      onclick="toggleMenu()"
      aria-label="Menü öffnen"
      aria-expanded="false"
    >

      <span></span>
      <span></span>
      <span></span>

    </button>


    <!-- MENU -->

    <div
      class="menu-panel"
      id="menuPanel"
    >

      <a href="index.html">
        <span class="menu-icon">🏠</span>
        Startseite
      </a>


      <a href="deals.html">
        <span class="menu-icon">🔥</span>
        Deals
      </a>


      <a href="kategorien.html">
        <span class="menu-icon">📂</span>
        Kategorien
      </a>


      <a href="suche.html">
        <span class="menu-icon">🔍</span>
        Suche
      </a>


      <div class="menu-divider"></div>


      <a href="konto.html">
        <span class="menu-icon">👤</span>
        Konto / Anmelden
      </a>

    </div>

  </header>


  <!-- =========================
       STARTSEITE
  ========================== -->

  <main>

    <section class="hero">

      <h1>
        Finde bessere <span>Deals.</span>
      </h1>


      <p>
        Produkte entdecken, Preise vergleichen und Angebote finden.
      </p>

    </section>

  </main>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer>

    <div class="footer-logo">
      Deal<span>Kira</span>
    </div>

    <p>
      Produkte entdecken. Deals finden. Preise vergleichen.
    </p>

  </footer>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script>

    function toggleMenu() {

      const menu =
        document.getElementById("menuPanel");

      const button =
        document.getElementById("menuButton");


      const isOpen =
        menu.classList.toggle("open");


      button.classList.toggle("active");


      button.setAttribute(
        "aria-expanded",
        isOpen
      );

    }


    function closeMenu() {

      const menu =
        document.getElementById("menuPanel");

      const button =
        document.getElementById("menuButton");


      menu.classList.remove("open");

      button.classList.remove("active");


      button.setAttribute(
        "aria-expanded",
        "false"
      );

    }


    /* Menü schließen bei Klick außerhalb */

    document.addEventListener(
      "click",
      function(event) {

        const menu =
          document.getElementById("menuPanel");

        const button =
          document.getElementById("menuButton");


        if (
          !menu.contains(event.target) &&
          !button.contains(event.target)
        ) {

          closeMenu();

        }

      }
    );


    /* Menü mit ESC schließen */

    document.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Escape") {

          closeMenu();

        }

      }
    );

  </script>


</body>
</html>
