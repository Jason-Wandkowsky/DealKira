<style>

    body {
      background: #181818;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      flex: 1;

      display: flex;
      align-items: flex-start;
      justify-content: center;

      text-align: center;

      padding: 55px 6% 50px;
    }

    .hero-content {
      max-width: 850px;
      width: 100%;
    }

    .hero h1 {
      font-size: 58px;
      line-height: 1.1;

      margin-bottom: 14px;

      font-weight: 800;
      color: #fff;
    }

    .hero h1 span {
      color: #ffd400;
    }

    .hero p {
      font-size: 21px;
      color: #bdbdbd;

      max-width: 650px;

      margin: 0 auto 28px;
    }

    /* =========================
       SHORTCUTS
    ========================= */

    .shortcuts {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;

      margin-top: 5px;
    }

    .shortcut {
      min-width: 180px;

      padding: 14px 20px;

      background: #222;
      border: 1px solid #333;

      border-radius: 10px;

      color: #fff;
      text-decoration: none;

      font-size: 16px;
      font-weight: 700;

      transition: 0.2s;
    }

    .shortcut:hover {
      background: #ffd400;
      color: #111;
      border-color: #ffd400;

      transform: translateY(-2px);
    }

    /* Deals entdecken bleibt gelb */

    .shortcut.primary {
      background: #ffd400;
      border-color: #ffd400;
      color: #111;
    }

    .shortcut.primary:hover {
      background: #111;
      color: #ffd400;
      border-color: #ffd400;
    }

    .shortcut-icon {
      margin-right: 7px;
    }

    /* =========================
       TABLET
    ========================= */

    @media (max-width: 800px) {

      .hero {
        padding: 45px 5% 40px;
      }

      .hero h1 {
        font-size: 46px;
      }

      .hero p {
        font-size: 19px;
      }

      .shortcut {
        min-width: 170px;
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 550px) {

      .hero {
        padding: 35px 5% 35px;
      }

      .hero h1 {
        font-size: 37px;
      }

      .hero p {
        font-size: 18px;
        margin-bottom: 25px;
      }

      .shortcuts {
        flex-direction: column;
        gap: 10px;
      }

      .shortcut {
        width: 100%;
      }

    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <site-header></site-header>

  <!-- =========================
       STARTSEITE
  ========================= -->

  <main class="hero">

    <div class="hero-content">

      <h1>
        Finde bessere <span>Deals.</span>
      </h1>

      <p>
        DealKira hilft dir dabei, interessante Angebote und gute Preise schneller zu entdecken.
      </p>

      <!-- =========================
           SHORTCUTS
      ========================= -->

      <div class="shortcuts">

        <a href="deals.html" class="shortcut primary">
          <span class="shortcut-icon">🔥</span>
          Deals entdecken
        </a>

        <a href="suche.html" class="shortcut">
          <span class="shortcut-icon">🔍</span>
          Suche
        </a>

        <a href="kategorien.html" class="shortcut">
          <span class="shortcut-icon">📂</span>
          Kategorien
        </a>

      </div>

    </div>

  </main>

  <!-- =========================
       FOOTER
  ========================= -->

  <site-footer></site-footer>

</body>
