<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tablets – DealKira</title>
  <meta
    name="description"
    content="Tablets vergleichen und günstige Deals finden – Samsung, Apple, Lenovo, Xiaomi, Huawei, OnePlus, Microsoft Surface, HONOR und Amazon Fire."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      height: 72px;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      width: 220px;
      height: 55px;
      display: flex;
      align-items: center;
      overflow: visible;
    }

    .logo img {
      height: 120px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .nav a {
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      transition: 0.2s;
    }

    .nav a:hover {
      color: #ffd400;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      background: #111;
      color: #fff;
      padding: 55px 20px 50px;
      text-align: center;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .hero p {
      font-size: 18px;
      color: #ccc;
    }

    /* =========================
       FILTER
    ========================= */

    .filter-section {
      max-width: 1400px;
      margin: 30px auto 10px;
      padding: 0 20px;
    }

    .filter-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .filter-button {
      border: none;
      background: #fff;
      padding: 11px 18px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: 0.2s;
    }

    .filter-button:hover {
      background: #ffd400;
    }

    .filter-button.active {
      background: #ffd400;
      color: #000;
    }

    /* =========================
       SUBFILTER
    ========================= */

    .subfilter-wrapper {
      max-width: 1400px;
      margin: 15px auto 0;
      padding: 0 20px;
      display: none;
    }

    .subfilter-wrapper.show {
      display: block;
    }

    .subfilters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .subfilter-button {
      border: 1px solid #ddd;
      background: #fff;
      padding: 9px 15px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }

    .subfilter-button:hover {
      background: #ffd400;
      border-color: #ffd400;
    }

    .subfilter-button.active {
      background: #ffd400;
      border-color: #ffd400;
      font-weight: 600;
    }

    /* =========================
       PRODUCTS
    ========================= */

    .products-section {
      max-width: 1400px;
      margin: 30px auto 60px;
      padding: 0 20px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 22px;
    }

    .deal-card {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      transition: 0.2s;
      position: relative;
      overflow: hidden;
    }

    .deal-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 22px rgba(0,0,0,0.12);
    }

    /* =========================
       PRODUCT IMAGE
    ========================= */

    .product-image-wrap {
      width: 100%;
      height: 230px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
      background: #fafafa;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    .product-image {
      max-width: 100%;
      max-height: 210px;
      object-fit: contain;
      display: block;
    }

    .no-image {
      color: #999;
      font-size: 15px;
      text-align: center;
    }

    /* =========================
       FAVORITE BUTTON
    ========================= */

    .favorite-button {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.95);
      box-shadow: 0 3px 12px rgba(0,0,0,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      z-index: 5;
      transition: 0.2s;
    }

    .favorite-button:hover {
      transform: scale(1.08);
      background: #fff;
    }

    .favorite-button.active {
      color: #e60023;
    }

    .favorite-button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    /* =========================
       PRODUCT INFO
    ========================= */

    .product-brand {
      display: inline-block;
      font-size: 13px;
      font-weight: 700;
      color: #777;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .product-name {
      font-size: 18px;
      line-height: 1.35;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .product-price {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .product-shop {
      font-size: 13px;
      color: #777;
      margin-bottom: 15px;
    }

    /* =========================
       ACTIONS
    ========================= */

    .product-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .deal-button {
      flex: 1;
      border: none;
      background: #ffd400;
      color: #000;
      padding: 12px 15px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: 0.2s;
    }

    .deal-button:hover {
      background: #f2c800;
      transform: translateY(-1px);
    }

    /* =========================
       EMPTY / LOADING
    ========================= */

    .loading,
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 50px 20px;
      color: #777;
      font-size: 18px;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      background: #000;
      color: #fff;
      text-align: center;
      padding: 30px 20px;
      margin-top: 50px;
    }

    footer p {
      color: #aaa;
      font-size: 14px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 1100px) {
      .products-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 800px) {
      header {
        padding: 0 15px;
      }

      .logo {
        width: 160px;
      }

      .logo img {
        height: 105px;
      }

      .nav {
        gap: 12px;
      }

      .nav a {
        font-size: 14px;
      }

      .hero h1 {
        font-size: 34px;
      }

      .products-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 550px) {
      header {
        height: 65px;
      }

      .logo {
        width: 140px;
        height: 50px;
      }

      .logo img {
        height: 92px;
      }

      .nav {
        gap: 8px;
      }

      .nav a {
        font-size: 13px;
      }

      .hero {
        padding: 40px 15px;
      }

      .hero h1 {
        font-size: 30px;
      }

      .hero p {
        font-size: 16px;
      }

      .products-grid {
        grid-template-columns: 1fr;
      }

      .product-image-wrap {
        height: 250px;
      }

      .favorite-button {
        width: 38px;
        height: 38px;
        top: 8px;
        right: 8px;
        font-size: 21px;
      }

      .filter-section,
      .subfilter-wrapper,
      .products-section {
        padding-left: 12px;
        padding-right: 12px;
      }
    }
  </style>
</head>

  <!-- =========================
       SUPABASE
  ========================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://zniknbouugmgvqkkoamo.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Jr7OScG8lgIja_Hav5-mw_B_htFgzI";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    let allProducts = [];
    let currentBrand = "Alle";
    let currentSeries = "Alle";

    /* =========================
       AUTH
    ========================= */

    async function getCurrentUser() {
      if (!supabaseClient) {
        return null;
      }

      try {
        const {
          data: sessionData,
          error: sessionError
        } = await supabaseClient.auth.getSession();

        if (
          !sessionError &&
          sessionData &&
          sessionData.session &&
          sessionData.session.user
        ) {
          return sessionData.session.user;
        }

        const {
          data: userData,
          error: userError
        } = await supabaseClient.auth.getUser();

        if (
          !userError &&
          userData &&
          userData.user
        ) {
          return userData.user;
        }
      } catch (error) {
        console.error(
          "Benutzer/Session konnte nicht geladen werden:",
          error
        );
      }

      return null;
    }

    /* =========================
       FAVORITE TOGGLE
    ========================= */

    async function toggleFavorite(button) {
      const card = button.closest(".deal-card");

      if (!card) {
        return;
      }

      const user = await getCurrentUser();

      if (!user) {
        alert(
          "Bitte melde dich zuerst an, um Produkte zu deinen Favoriten hinzuzufügen."
        );

        window.location.href = "konto.html";
        return;
      }

      const productId =
        card.dataset.productId;

      const productName =
        card.dataset.productName || "";

      const productImage =
        card.dataset.productImage || "";

      const productPrice =
        card.dataset.productPrice || "";

      const productShop =
        card.dataset.productShop || "";

      const productLink =
        card.dataset.productLink || "";

      button.disabled = true;

      try {
        const {
          data: existingFavorite,
          error: selectError
        } = await supabaseClient
          .from("favoriten")
          .select("id")
          .eq("user_id", user.id)
          .eq("produkt_id", productId)
          .maybeSingle();

        if (selectError) {
          console.error(
            "Favorit konnte nicht geprüft werden:",
            selectError
          );

          alert(
            "Der Favorit konnte nicht geprüft werden."
          );

          button.disabled = false;
          return;
        }

        if (existingFavorite) {

          const {
            error: deleteError
          } = await supabaseClient
            .from("favoriten")
            .delete()
            .eq("id", existingFavorite.id)
            .eq("user_id", user.id);

          if (deleteError) {
            console.error(
              "Favorit konnte nicht entfernt werden:",
              deleteError
            );

            alert(
              "Der Favorit konnte nicht entfernt werden."
            );

            button.disabled = false;
            return;
          }

          button.classList.remove("active");
          button.textContent = "♡";

          button.setAttribute(
            "aria-label",
            productName +
            " zu Favoriten hinzufügen"
          );

        } else {

          const {
            error: insertError
          } = await supabaseClient
            .from("favoriten")
            .insert({
              user_id: user.id,
              produkt_id: productId,
              produkt_name: productName,
              produkt_bild: productImage,
              produkt_preis: productPrice,
              produkt_shop: productShop,
              produkt_link: productLink
            });

          if (insertError) {
            console.error(
              "Favorit konnte nicht gespeichert werden:",
              insertError
            );

            alert(
              "Der Favorit konnte nicht gespeichert werden."
            );

            button.disabled = false;
            return;
          }

          button.classList.add("active");
          button.textContent = "♥";

          button.setAttribute(
            "aria-label",
            productName +
            " aus Favoriten entfernen"
          );
        }

      } catch (error) {

        console.error(
          "Fehler beim Favoriten:",
          error
        );

        alert(
          "Es ist ein Fehler beim Favoriten aufgetreten."
        );
      }

      button.disabled = false;
    }

    /* =========================
       FAVORITES LADEN
    ========================= */

    async function loadFavorites() {
      const user = await getCurrentUser();

      if (!user) {
        return;
      }

      const {
        data: favorites,
        error
      } = await supabaseClient
        .from("favoriten")
        .select("produkt_id")
        .eq("user_id", user.id);

      if (error) {
        console.error(
          "Favoriten konnten nicht geladen werden:",
          error
        );

        return;
      }

      const favoriteIds = new Set(
        favorites.map(function(favorite) {
          return favorite.produkt_id;
        })
      );

      document
        .querySelectorAll(".deal-card")
        .forEach(function(card) {

          const productId =
            card.dataset.productId;

          const button =
            card.querySelector(
              ".favorite-button"
            );

          if (!button) {
            return;
          }

          if (favoriteIds.has(productId)) {

            button.classList.add("active");
            button.textContent = "♥";

            button.setAttribute(
              "aria-label",
              card.dataset.productName +
              " aus Favoriten entfernen"
            );

          } else {

            button.classList.remove("active");
            button.textContent = "♡";

            button.setAttribute(
              "aria-label",
              card.dataset.productName +
              " zu Favoriten hinzufügen"
            );
          }
        });
    }

    /* =========================
       AUTH LISTENER
    ========================= */

    supabaseClient.auth.onAuthStateChange(
      function(event, session) {

        if (session) {

          setTimeout(function() {
            loadFavorites();
          }, 0);

        } else {

          document
            .querySelectorAll(".favorite-button")
            .forEach(function(button) {

              button.classList.remove("active");
              button.textContent = "♡";
            });
        }
      }
    );

    /* =========================
       PRODUCTS LOAD
    ========================= */

    async function loadProducts() {

      const grid =
        document.getElementById(
          "productsGrid"
        );

      try {

        const response =
          await fetch("tablets.json");

        if (!response.ok) {
          throw new Error(
            "tablets.json konnte nicht geladen werden."
          );
        }

        allProducts =
          await response.json();

        renderProducts();

      } catch (error) {

        console.error(
          "Fehler beim Laden der Tablets:",
          error
        );

        grid.innerHTML = `
          <div class="empty">
            Die Tablets konnten nicht geladen werden.
          </div>
        `;
      }
    }

    /* =========================
       SUBFILTER ERSTELLEN
    ========================= */

    function createSubfilters() {

      const wrapper =
        document.getElementById(
          "subfilterWrapper"
        );

      const container =
        document.getElementById(
          "subfilters"
        );

      container.innerHTML = "";

      if (
        currentBrand === "Alle"
      ) {
        wrapper.classList.remove("show");
        return;
      }

      const brandProducts =
        allProducts.filter(function(product) {
          return product.brand === currentBrand;
        });

      const seriesList = [];

      brandProducts.forEach(function(product) {

        const series =
          product.series || "";

        if (
          series &&
          !seriesList.includes(series)
        ) {
          seriesList.push(series);
        }
      });

      if (seriesList.length === 0) {
        wrapper.classList.remove("show");
        return;
      }

      wrapper.classList.add("show");

      const allButton =
        document.createElement("button");

      allButton.className =
        "subfilter-button active";

      allButton.textContent = "Alle";

      allButton.onclick =
        function() {

          currentSeries = "Alle";

          document
            .querySelectorAll(
              ".subfilter-button"
            )
            .forEach(function(button) {
              button.classList.remove(
                "active"
              );
            });

          allButton.classList.add(
            "active"
          );

          renderProducts();
        };

      container.appendChild(
        allButton
      );

      seriesList.forEach(function(series) {

        const button =
          document.createElement("button");

        button.className =
          "subfilter-button";

        button.textContent =
          series;

        button.onclick =
          function() {

            currentSeries =
              series;

            document
              .querySelectorAll(
                ".subfilter-button"
              )
              .forEach(function(button) {
                button.classList.remove(
                  "active"
                );
              });

            button.classList.add(
              "active"
            );

            renderProducts();
          };

        container.appendChild(
          button
        );
      });
    }

    /* =========================
       PRODUCTS RENDER
    ========================= */

    function renderProducts() {

      const grid =
        document.getElementById(
          "productsGrid"
        );

      let products =
        allProducts.filter(function(product) {

          const brandMatches =
            currentBrand === "Alle" ||
            product.brand === currentBrand;

          const seriesMatches =
            currentSeries === "Alle" ||
            product.series === currentSeries;

          return (
            brandMatches &&
            seriesMatches
          );
        });

      grid.innerHTML = "";

      if (products.length === 0) {

        grid.innerHTML = `
          <div class="empty">
            Keine Tablets gefunden.
          </div>
        `;

        return;
      }

      products.forEach(function(product) {

        const card =
          document.createElement("article");

        card.className =
          "deal-card";

        card.dataset.productId =
          product.id || "";

        card.dataset.productName =
          product.name || "";

        card.dataset.productImage =
          product.image || "";

        card.dataset.productPrice =
          product.price || "";

        card.dataset.productShop =
          product.shop || "";

        card.dataset.productLink =
          product.link || "";

        /* =========================
           IMAGE WRAP
        ========================= */

        const imageWrap =
          document.createElement("div");

        imageWrap.className =
          "product-image-wrap";

        /* =========================
           IMAGE
        ========================= */

        if (product.image) {

          const image =
            document.createElement("img");

          image.className =
            "product-image";

          image.src =
            product.image;

          image.alt =
            product.name || "Tablet";

          image.loading = "lazy";

          image.onerror =
            function() {

              image.remove();

              const noImage =
                document.createElement("div");

              noImage.className =
                "no-image";

              noImage.textContent =
                "Kein Produktbild";

              imageWrap.insertBefore(
                noImage,
                imageWrap.firstChild
              );
            };

          imageWrap.appendChild(
            image
          );

        } else {

          const noImage =
            document.createElement("div");

          noImage.className =
            "no-image";

          noImage.textContent =
            "Kein Produktbild";

          imageWrap.appendChild(
            noImage
          );
        }

        /* =========================
           FAVORITE BUTTON
        ========================= */

        const favoriteButton =
          document.createElement("button");

        favoriteButton.type =
          "button";

        favoriteButton.className =
          "favorite-button";

        favoriteButton.textContent =
          "♡";

        favoriteButton.setAttribute(
          "aria-label",
          (product.name || "Produkt") +
          " zu Favoriten hinzufügen"
        );

        favoriteButton.onclick =
          function(event) {

            event.preventDefault();
            event.stopPropagation();

            toggleFavorite(
              favoriteButton
            );
          };

        imageWrap.appendChild(
          favoriteButton
        );

        /* =========================
           PRODUCT INFO
        ========================= */

        const info =
          document.createElement("div");

        const brand =
          document.createElement("div");

        brand.className =
          "product-brand";

        brand.textContent =
          product.brand || "";

        info.appendChild(
          brand
        );

        const name =
          document.createElement("div");

        name.className =
          "product-name";

        name.textContent =
          product.name || "";

        info.appendChild(
          name
        );

        if (product.price) {

          const price =
            document.createElement("div");

          price.className =
            "product-price";

          price.textContent =
            product.price;

          info.appendChild(
            price
          );
        }

        if (product.shop) {

          const shop =
            document.createElement("div");

          shop.className =
            "product-shop";

          shop.textContent =
            "Shop: " +
            product.shop;

          info.appendChild(
            shop
          );
        }

        /* =========================
           DEAL BUTTON
        ========================= */

        const actions =
          document.createElement("div");

        actions.className =
          "product-actions";

        const dealButton =
          document.createElement("a");

        dealButton.className =
          "deal-button";

        dealButton.textContent =
          "Zum Deal";

        dealButton.href =
          product.link || "#";

        dealButton.target =
          "_blank";

        dealButton.rel =
          "nofollow sponsored noopener";

        actions.appendChild(
          dealButton
        );

        info.appendChild(
          actions
        );

        /* =========================
           CARD ZUSAMMENBAUEN
        ========================= */

        card.appendChild(
          imageWrap
        );

        card.appendChild(
          info
        );

        grid.appendChild(
          card
        );
      });

      loadFavorites();
    }

    /* =========================
       BRAND FILTER
    ========================= */

    document
      .querySelectorAll(
        ".filter-button"
      )
      .forEach(function(button) {

        button.addEventListener(
          "click",
          function() {

            document
              .querySelectorAll(
                ".filter-button"
              )
              .forEach(function(button) {
                button.classList.remove(
                  "active"
                );
              });

            this.classList.add(
              "active"
            );

            currentBrand =
              this.dataset.brand;

            currentSeries =
              "Alle";

            createSubfilters();

            renderProducts();
          }
        );
      });

    /* =========================
       START
    ========================= */

    loadProducts();

  </script>

</body>
</html>
