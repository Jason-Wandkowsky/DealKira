<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tablets – DealKira</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    header {
      height: 82px;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
      position: relative;
      z-index: 1000;
    }

    .logo {
      width: 280px;
      height: 65px;
      display: flex;
      align-items: center;
      overflow: visible;
      position: relative;
    }

    .logo img {
      height: 320px;
      width: auto;
      max-width: none;
      display: block;
    }

    .menu-button {
      width: 48px;
      height: 48px;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: 0.2s;
    }

    .menu-button span {
      width: 23px;
      height: 3px;
      background: #ffd400;
      border-radius: 3px;
      transition: 0.2s;
    }

    .menu-button:hover {
      background: #252525;
      border-color: #ffd400;
    }

    .menu-button.active span:nth-child(1) {
      transform: translateY(8px) rotate(45deg);
    }

    .menu-button.active span:nth-child(2) {
      opacity: 0;
    }

    .menu-button.active span:nth-child(3) {
      transform: translateY(-8px) rotate(-45deg);
    }

    .menu-panel {
      position: absolute;
      top: 82px;
      right: 6%;
      width: 270px;
      background: #111;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 10px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.5);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: 0.2s;
    }

    .menu-panel.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .menu-panel a {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
      text-decoration: none;
      padding: 14px 15px;
      border-radius: 9px;
      font-weight: 700;
      transition: 0.2s;
    }

    .menu-panel a:hover {
      background: #222;
      color: #ffd400;
    }

    .menu-icon {
      width: 25px;
      text-align: center;
      font-size: 19px;
    }

    .menu-divider {
      height: 1px;
      background: #333;
      margin: 8px 5px;
    }

    .hero {
      background: #111;
      color: #fff;
      text-align: center;
      padding: 55px 20px 60px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .hero p {
      font-size: 18px;
      color: #ccc;
    }

    .products-section {
      max-width: 1100px;
      margin: 45px auto 70px;
      padding: 0 20px;
    }

    .products-top {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 25px;
    }

    .filter-button {
      background: #ffd400;
      color: #111;
      border: none;
      border-radius: 10px;
      padding: 12px 22px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .filter-button:hover {
      transform: translateY(-2px);
    }

    .filter-message {
      display: none;
      background: #fff;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 22px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    .filter-message.show {
      display: block;
    }

    .filter-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .filter-group:last-child {
      margin-bottom: 0;
    }

    .filter-label {
      width: 100%;
      font-size: 13px;
      color: #777;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .filter-choice {
      background: #f1f1f1;
      color: #111;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .filter-choice:hover {
      border-color: #ffd400;
      background: #fff8c7;
    }

    .filter-choice.active {
      background: #ffd400;
      border-color: #ffd400;
      color: #111;
    }

    .filter-choice.reset {
      background: #111;
      border-color: #111;
      color: #fff;
    }

    .filter-choice.reset:hover {
      background: #222;
      border-color: #222;
    }

    #seriesButtons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
    }

    .product-card {
      background: #fff;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
      position: relative;
      transition: 0.2s;
      min-width: 0;
    }

    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
    }

    .product-card.hidden {
      display: none;
    }

    .product-image-wrap {
      width: 100%;
      height: 230px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
      background: #fafafa;
      border-radius: 12px;
      overflow: hidden;
    }

    .product-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .product-info {
      display: flex;
      flex-direction: column;
    }

    .product-brand {
      color: #777;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .product-name {
      font-size: 19px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 12px;
    }

    .product-price {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .product-shop {
      font-size: 13px;
      color: #777;
      margin-bottom: 12px;
    }

    .product-actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .deal-button {
      flex: 1;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      background: #ffd400;
      color: #111;
      text-decoration: none;
      border-radius: 9px;
      padding: 11px 12px;
      font-size: 14px;
      font-weight: 700;
      transition: 0.2s;
    }

    .deal-button:hover {
      transform: translateY(-2px);
    }

    /*
      FAVORITEN
      Exakt wie bei deals.html
    */

    .favorite-button {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.95);
      box-shadow: 0 3px 12px rgba(0,0,0,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      z-index: 5;
      transition: 0.2s;
    }

    .favorite-button:hover {
      transform: scale(1.08);
      background: #fff;
    }

    .favorite-button.active {
      color: #e60023;
    }

    .favorite-button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    .loading-state,
    .error-state,
    .no-results-state {
      grid-column: 1 / -1;
      background: #fff;
      border-radius: 16px;
      padding: 55px 30px;
      text-align: center;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    .state-icon {
      font-size: 60px;
      margin-bottom: 18px;
    }

    .loading-state h2,
    .error-state h2,
    .no-results-state h2 {
      font-size: 25px;
      margin-bottom: 10px;
    }

    .loading-state p,
    .error-state p,
    .no-results-state p {
      color: #666;
      font-size: 16px;
    }

    footer {
      background: #111;
      color: #aaa;
      text-align: center;
      padding: 30px 20px;
      font-size: 14px;
    }

    @media (max-width: 800px) {

      .logo {
        width: 225px;
      }

      .logo img {
        height: 275px;
      }

      .product-image-wrap {
        height: 200px;
      }

    }

    @media (max-width: 550px) {

      header {
        padding: 0 5%;
      }

      .logo {
        width: 190px;
        height: 50px;
      }

      .logo img {
        height: 235px;
      }

      .menu-panel {
        right: 5%;
        width: 270px;
      }

      .hero {
        padding: 42px 15px 48px;
      }

      .hero h1 {
        font-size: 30px;
      }

      .hero p {
        font-size: 15px;
      }

      .products-section {
        margin: 35px auto 50px;
        padding: 0 12px;
      }

      .products-top {
        margin-bottom: 18px;
      }

      .filter-button {
        padding: 10px 17px;
        font-size: 14px;
      }

      .filter-message {
        padding: 14px 10px;
      }

      .filter-choice {
        padding: 7px 9px;
        font-size: 12px;
      }

      .products {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .product-card {
        padding: 10px;
        border-radius: 13px;
      }

      .product-image-wrap {
        height: 145px;
        margin-bottom: 10px;
        border-radius: 9px;
      }

      .product-brand {
        font-size: 10px;
        margin-bottom: 4px;
      }

      .product-name {
        font-size: 14px;
        margin-bottom: 8px;
      }

      .product-price {
        font-size: 16px;
        margin-bottom: 9px;
      }

      .product-shop {
        font-size: 10px;
        margin-bottom: 9px;
      }

      .product-actions {
        gap: 6px;
      }

      .deal-button {
        padding: 9px 6px;
        font-size: 11px;
      }

      .favorite-button {
        width: 38px;
        height: 38px;
        flex: 0 0 38px;
        font-size: 21px;
      }

      .loading-state,
      .error-state,
      .no-results-state {
        padding: 45px 15px;
        border-radius: 13px;
      }

      .state-icon {
        font-size: 50px;
      }

      .loading-state h2,
      .error-state h2,
      .no-results-state h2 {
        font-size: 20px;
      }

      .loading-state p,
      .error-state p,
      .no-results-state p {
        font-size: 14px;
      }

    }

    @media (max-width: 380px) {

      .logo {
        width: 170px;
      }

      .logo img {
        height: 215px;
      }

      .menu-button {
        width: 45px;
        height: 45px;
      }

      .product-image-wrap {
        height: 130px;
      }

      .product-name {
        font-size: 13px;
      }

      .product-price {
        font-size: 15px;
      }

    }

  </style>
</head>

<body>

  <header>

    <a href="index.html" class="logo">
      <img src="20879_nobg (1).png" alt="DealKira">
    </a>

    <button
      class="menu-button"

      onclick="toggleMenu()"

    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="menu-panel" id="menuPanel">

      <a href="konto.html">
        <span class="menu-icon">👤</span>

  <section class="hero">

    <h1>Tablets</h1>

    <p>
      Tablets für Arbeit, Unterhaltung, Gaming und Alltag entdecken
    </p>

  </section>


  <main class="products-section">

    <div class="products-top">

      <button
        class="filter-button"
        onclick="toggleFilter()"
      >
        ⚙️ Filter
      </button>

    </div>


    <div
      class="filter-message"
      id="filterMessage"
    >

      <div class="filter-title">
        Tablets filtern
      </div>

      <div class="filter-group">

        <div class="filter-label">
          Hersteller
        </div>

        <button
          class="filter-choice reset"
          id="filterAll"
          onclick="resetFilters()"
        >
          Alle
        </button>

        <button
          class="filter-choice"
          data-brand="Samsung"
          onclick="toggleBrandFilter('Samsung')"
        >
          Samsung
        </button>

        <button
          class="filter-choice"
          data-brand="Apple"
          onclick="toggleBrandFilter('Apple')"
        >
          Apple
        </button>

        <button
          class="filter-choice"
          data-brand="Lenovo"
          onclick="toggleBrandFilter('Lenovo')"
        >
          Lenovo
        </button>

        <button
          class="filter-choice"
          data-brand="Xiaomi"
          onclick="toggleBrandFilter('Xiaomi')"
        >
          Xiaomi
        </button>

        <button
          class="filter-choice"
          data-brand="Huawei"
          onclick="toggleBrandFilter('Huawei')"
        >
          Huawei
        </button>

        <button
          class="filter-choice"
          data-brand="OnePlus"
          onclick="toggleBrandFilter('OnePlus')"
        >
          OnePlus
        </button>

        <button
          class="filter-choice"
          data-brand="Microsoft Surface"
          onclick="toggleBrandFilter('Microsoft Surface')"
        >
          Microsoft Surface
        </button>

        <button
          class="filter-choice"
          data-brand="HONOR"
          onclick="toggleBrandFilter('HONOR')"
        >
          HONOR
        </button>

        <button
          class="filter-choice"
          data-brand="Amazon Fire"
          onclick="toggleBrandFilter('Amazon Fire')"
        >
          Amazon Fire
        </button>

      </div>


      <div
        class="filter-group"
        id="seriesFilterGroup"
        style="display:none;"
      >

        <div class="filter-label">
          Serie
        </div>

        <div id="seriesButtons"></div>

      </div>

    </div>


    <div
      class="products"
      id="products"
    >

      <div class="loading-state">

        <div class="state-icon">
          📲
        </div>

        <h2>
          Tablets werden geladen …
        </h2>

        <p>
          Bitte einen Moment warten.
        </p>

      </div>

    </div>

  </main>


  <footer>

    © 2026 DealKira – Bessere Deals finden

  </footer>


  <script>

    /*
      ==========================================
      MENÜ
      ==========================================
    */

    function toggleMenu() {

      const menu =
        document.getElementById("menuPanel");

      const button =
        document.getElementById("menuButton");

      const isOpen =
        menu.classList.toggle("open");

      button.classList.toggle("active");

      button.setAttribute(
        "aria-expanded",
        isOpen
      );

    }


    function closeMenu() {

      const menu =
        document.getElementById("menuPanel");

      const button =
        document.getElementById("menuButton");

      menu.classList.remove("open");

      button.classList.remove("active");

      button.setAttribute(
        "aria-expanded",
        "false"
      );

    }


    document.addEventListener(
      "click",
      function(event) {

        const menu =
          document.getElementById("menuPanel");

        const button =
          document.getElementById("menuButton");

        if (
          !menu.contains(event.target) &&
          !button.contains(event.target)
        ) {

          closeMenu();

        }

      }
    );


    document.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Escape") {

          closeMenu();

        }

      }
    );


    /*
      ==========================================
      FILTER
      ==========================================
    */

    let activeBrand = null;
    let activeSeries = null;

    const seriesMap = {

      "Samsung": [
        {
          value: "S",
          label: "S-Serie"
        },
        {
          value: "A",
          label: "A-Serie"
        },
        {
          value: "Active",
          label: "Tab Active"
        }
      ],

      "Apple": [
        {
          value: "Serie",
          label: "Serie"
        },
        {
          value: "mini",
          label: "mini"
        },
        {
          value: "Air",
          label: "Air"
        },
        {
          value: "Pro",
          label: "Pro"
        }
      ],

      "Lenovo": [
        {
          value: "Tab",
          label: "Tab"
        },
        {
          value: "Idea Tab",
          label: "Idea Tab"
        },
        {
          value: "Yoga",
          label: "Yoga"
        },
        {
          value: "Legion",
          label: "Legion"
        }
      ],

      "Xiaomi": [
        {
          value: "Xiaomi Pad",
          label: "Xiaomi Pad"
        },
        {
          value: "Redmi Pad",
          label: "Redmi Pad"
        }
      ],

      "Huawei": [
        {
          value: "MatePad",
          label: "MatePad-Serie"
        },
        {
          value: "MatePad SE",
          label: "MatePad SE"
        }
      ],

      "OnePlus": [],

      "Microsoft Surface": [
        {
          value: "Pro",
          label: "Pro"
        },
        {
          value: "Go",
          label: "Go"
        }
      ],

      "HONOR": [
        {
          value: "MagicPad",
          label: "MagicPad"
        },
        {
          value: "Pad",
          label: "Pad"
        }
      ],

      "Amazon Fire": [
        {
          value: "HD",
          label: "HD"
        },
        {
          value: "Max",
          label: "Max"
        }
      ]

    };


    function toggleFilter() {

      const message =
        document.getElementById("filterMessage");

      message.classList.toggle("show");

    }


    function toggleBrandFilter(brand) {

      if (activeBrand === brand) {

        activeBrand = null;
        activeSeries = null;

      } else {

        activeBrand = brand;
        activeSeries = null;

      }

      updateSeriesButtons();
      updateFilterButtons();
      applyFilters();

    }


    function toggleSeriesFilter(series) {

      if (!activeBrand) {
        return;
      }

      if (activeSeries === series) {

        activeSeries = null;

      } else {

        activeSeries = series;

      }

      updateSeriesButtons();
      updateFilterButtons();
      applyFilters();

    }


    function resetFilters() {

      activeBrand = null;
      activeSeries = null;

      updateSeriesButtons();
      updateFilterButtons();
      applyFilters();

    }


    function updateSeriesButtons() {

      const group =
        document.getElementById("seriesFilterGroup");

      const container =
        document.getElementById("seriesButtons");

      container.innerHTML = "";

      if (
        !activeBrand ||
        !seriesMap[activeBrand] ||
        seriesMap[activeBrand].length === 0
      ) {

        group.style.display = "none";
        return;

      }

      group.style.display = "flex";

      seriesMap[activeBrand].forEach(function(series) {

        const button =
          document.createElement("button");

        button.className =
          "filter-choice";

        button.textContent =
          series.label;

        button.onclick =
          function() {

            toggleSeriesFilter(
              series.value
            );

          };

        if (
          activeSeries === series.value
        ) {

          button.classList.add("active");

        }

        container.appendChild(button);

      });

    }


    function updateFilterButtons() {

      const buttons =
        document.querySelectorAll(
          ".filter-choice[data-brand]"
        );

      buttons.forEach(function(button) {

        const brand =
          button.dataset.brand;

        if (
          activeBrand === brand
        ) {

          button.classList.add("active");

        } else {

          button.classList.remove("active");

        }

      });


      const allButton =
        document.getElementById("filterAll");

      if (
        activeBrand === null
      ) {

        allButton.classList.add("active");

      } else {

        allButton.classList.remove("active");

      }

    }


    function applyFilters() {

      const cards =
        document.querySelectorAll(
          ".product-card"
        );

      let visibleCount = 0;

      cards.forEach(function(card) {

        const cardBrand =
          card.dataset.brand || "";

        const cardSeries =
          card.dataset.series || "";

        let visible = true;


        if (
          activeBrand !== null &&
          cardBrand !== activeBrand
        ) {

          visible = false;

        }


        if (
          activeSeries !== null &&
          cardSeries !== activeSeries
        ) {

          visible = false;

        }


        if (visible) {

          card.classList.remove("hidden");
          visibleCount++;

        } else {

          card.classList.add("hidden");

        }

      });


      updateNoResultsState(
        visibleCount
      );

    }


    function updateNoResultsState(
      visibleCount
    ) {

      const existing =
        document.getElementById(
          "noResultsState"
        );

      if (existing) {

        existing.remove();

      }

      if (visibleCount > 0) {
        return;
      }

      const products =
        document.getElementById(
          "products"
        );

      const state =
        document.createElement("div");

      state.id =
        "noResultsState";

      state.className =
        "no-results-state";

      state.innerHTML = `
        <div class="state-icon">🔎</div>
        <h2>Keine Tablets gefunden</h2>
        <p>Für den ausgewählten Filter sind keine passenden Produkte vorhanden.</p>
      `;

      products.appendChild(state);

    }


    /*
      ==========================================
      PRODUKTE AUS tablets.json LADEN
      ==========================================
    */

    let productsData = [];


    async function loadProducts() {

      const products =
        document.getElementById(
          "products"
        );

      try {

        const response =
          await fetch(
            "tablets.json",
            {
              cache: "no-cache"
            }
          );


        if (!response.ok) {

          throw new Error(
            "tablets.json konnte nicht geladen werden."
          );

        }


        productsData =
          await response.json();


        if (
          !Array.isArray(productsData)
        ) {

          throw new Error(
            "Die tablets.json enthält kein gültiges Produkt-Array."
          );

        }


        renderProducts();

      } catch (error) {

        console.error(
          "Fehler beim Laden der Tablets:",
          error
        );


        products.innerHTML = `

          <div class="error-state">

            <div class="state-icon">
              ⚠️
            </div>

            <h2>
              Tablets konnten nicht geladen werden
            </h2>

            <p>
              Bitte überprüfe, ob die Datei
              <strong>tablets.json</strong>
              korrekt neben dieser HTML-Datei liegt.
            </p>

          </div>

        `;

      }

    }


    function renderProducts() {

      const products =
        document.getElementById(
          "products"
        );

      products.innerHTML = "";


      if (
        productsData.length === 0
      ) {

        products.innerHTML = `

          <div class="no-results-state">

            <div class="state-icon">
              📲
            </div>

            <h2>
              Noch keine Produkte vorhanden
            </h2>

            <p>
              Hier werden bald passende Tablets und Angebote angezeigt.
            </p>

          </div>

        `;

        return;

      }


      productsData.forEach(function(product) {

        const card =
          document.createElement("article");

        card.className =
          "product-card";


        card.dataset.brand =
          product.brand || "";

        card.dataset.series =
          product.series || "";

        card.dataset.productId =
          product.id || "";

        card.dataset.productName =
          product.name || "";

        card.dataset.productImage =
          product.image || "";

        card.dataset.productPrice =
          product.price || "";

        card.dataset.productShop =
          product.shop || "";

        card.dataset.productLink =
          product.link || "";


        /*
          Produktbild
        */

        const imageWrap =
          document.createElement("div");

        imageWrap.className =
          "product-image-wrap";


        const image =
          document.createElement("img");

        image.className =
          "product-image";

        image.src =
          product.image || "";

        image.alt =
          product.name || "Tablet";

        image.loading =
          "lazy";


        image.onerror =
          function() {

            this.style.display =
              "none";

          };


        imageWrap.appendChild(
          image
        );


        /*
          Produktinformationen
        */

        const info =
          document.createElement("div");

        info.className =
          "product-info";


        const brand =
          document.createElement("div");

        brand.className =
          "product-brand";

        brand.textContent =
          product.brand || "";


        const name =
          document.createElement("div");

        name.className =
          "product-name";

        name.textContent =
          product.name || "Tablet";


        info.appendChild(
          brand
        );

        info.appendChild(
          name
        );


        /*
          Preis
        */

        if (
          product.price &&
          product.price.trim() !== ""
        ) {

          const price =
            document.createElement("div");

          price.className =
            "product-price";

          price.textContent =
            product.price;

          info.appendChild(
            price
          );

        }


        /*
          Shop
        */

        if (
          product.shop &&
          product.shop.trim() !== ""
        ) {

          const shop =
            document.createElement("div");

          shop.className =
            "product-shop";

          shop.textContent =
            "Shop: " + product.shop;

          info.appendChild(
            shop
          );

        }


        /*
          Buttons
        */

        const actions =
          document.createElement("div");

        actions.className =
          "product-actions";


        const dealButton =
          document.createElement("a");

        dealButton.className =
          "deal-button";

        dealButton.textContent =
          "Zum Deal";


        if (
          product.link &&
          product.link.trim() !== ""
        ) {

          dealButton.href =
            product.link;

          dealButton.target =
            "_blank";

          dealButton.rel =
            "nofollow sponsored noopener";

        } else {

          dealButton.href =
            "#";

          dealButton.onclick =
            function(event) {

              event.preventDefault();

            };

        }


        const favoriteButton =
          document.createElement("button");

        favoriteButton.className =
          "favorite-button";

        favoriteButton.type =
          "button";

        favoriteButton.innerHTML =
          "♡";

        favoriteButton.setAttribute(
          "aria-label",
          product.name +
          " zu Favoriten hinzufügen"
        );


        favoriteButton.onclick =
          function() {

            toggleFavorite(
              favoriteButton
            );

          };


        actions.appendChild(
          dealButton
        );

        actions.appendChild(
          favoriteButton
        );


        info.appendChild(
          actions
        );


        card.appendChild(
          imageWrap
        );

        card.appendChild(
          info
        );

        products.appendChild(
          card
        );

      });


      updateFilterButtons();
      updateSeriesButtons();
      applyFilters();

      loadFavorites();

    }


    /*
      ==========================================
      SUPABASE FAVORITEN
      EXAKT WIE BEI deals.html
      ==========================================
    */

    const SUPABASE_URL =
      "https://zniknbouugmgvqkkoamo.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Jr7OScG8lgIja_Hav5-mw_B_htFgzI";


    let supabaseClient = null;


    function initSupabase() {

      if (
        typeof window.supabase === "undefined"
      ) {

        return false;

      }


      if (supabaseClient) {

        return true;

      }


      try {

        supabaseClient =
          window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
          );

        return true;

      } catch (error) {

        console.error(
          "Supabase konnte nicht initialisiert werden:",
          error
        );

        return false;

      }

    }


    async function getCurrentUser() {

      if (!supabaseClient) {

        return null;

      }


      const {
        data,
        error
      } =
        await supabaseClient.auth.getUser();


      if (error) {

        console.error(
          "Benutzer konnte nicht geladen werden:",
          error
        );

        return null;

      }


      return data.user;

    }


    async function toggleFavorite(
      button
    ) {

      if (!initSupabase()) {

        return;

      }


      const user =
        await getCurrentUser();


      if (!user) {

        window.location.href =
          "konto.html";

        return;

      }


      const card =
        button.closest(
          ".product-card"
        );


      if (!card) {

        return;

      }


      button.disabled = true;


      try {

        const productId =
          card.dataset.productId || "";

        const productName =
          card.dataset.productName || "";

        const productImage =
          card.dataset.productImage || "";

        const productPrice =
          card.dataset.productPrice || "";

        const productShop =
          card.dataset.productShop || "";

        const productLink =
          card.dataset.productLink || "";


        const {
          data: existingFavorite,
          error: selectError
        } =
          await supabaseClient
            .from("favoriten")
            .select("id")
            .eq(
              "user_id",
              user.id
            )
            .eq(
              "produkt_id",
              productId
            )
            .maybeSingle();


        if (selectError) {

          console.error(
            "Favorit konnte nicht geprüft werden:",
            selectError
          );

          return;

        }


        if (existingFavorite) {

          const {
            error: deleteError
          } =
            await supabaseClient
              .from("favoriten")
              .delete()
              .eq(
                "id",
                existingFavorite.id
              )
              .eq(
                "user_id",
                user.id
              );


          if (deleteError) {

            console.error(
              "Favorit konnte nicht entfernt werden:",
              deleteError
            );

            return;

          }


          button.classList.remove(
            "active"
          );

          button.textContent =
            "♡";

          button.setAttribute(
            "aria-label",
            productName +
            " zu Favoriten hinzufügen"
          );

        } else {

          const {
            error: insertError
          } =
            await supabaseClient
              .from("favoriten")
              .insert({

                user_id:
                  user.id,

                produkt_id:
                  productId,

                produkt_name:
                  productName,

                produkt_bild:
                  productImage,

                produkt_preis:
                  productPrice,

                produkt_shop:
                  productShop,

                produkt_link:
                  productLink

              });


          if (insertError) {

            console.error(
              "Favorit konnte nicht gespeichert werden:",
              insertError
            );

            return;

          }


          button.classList.add(
            "active"
          );

          button.textContent =
            "♥";

          button.setAttribute(
            "aria-label",
            productName +
            " aus Favoriten entfernen"
          );

        }

      } catch (error) {

        console.error(
          "Fehler bei den Favoriten:",
          error
        );

      } finally {

        button.disabled = false;

      }

    }


    async function loadFavorites() {

      if (!initSupabase()) {

        return;

      }


      const user =
        await getCurrentUser();


      if (!user) {

        return;

      }


      const {
        data: favorites,
        error
      } =
        await supabaseClient
          .from("favoriten")
          .select("produkt_id")
          .eq(
            "user_id",
            user.id
          );


      if (error) {

        console.error(
          "Favoriten konnten nicht geladen werden:",
          error
        );

        return;

      }


      const favoriteIds =
        new Set(
          favorites.map(
            function(favorite) {

              return favorite.produkt_id;

            }
          )
        );


      document
        .querySelectorAll(
          ".product-card"
        )
        .forEach(
          function(card) {

            const productId =
              card.dataset.productId;

            const button =
              card.querySelector(
                ".favorite-button"
              );


            if (!button) {

              return;

            }


            if (
              favoriteIds.has(productId)
            ) {

              button.classList.add(
                "active"
              );

              button.textContent =
                "♥";

              button.setAttribute(
                "aria-label",
                card.dataset.productName +
                " aus Favoriten entfernen"
              );

            } else {

              button.classList.remove(
                "active"
              );

              button.textContent =
                "♡";

              button.setAttribute(
                "aria-label",
                card.dataset.productName +
                " zu Favoriten hinzufügen"
              );

            }

          }
        );

    }


    /*
      ==========================================
      AUTH-STATUS
      ==========================================
    */

    function setupAuthListener() {

      if (!supabaseClient) {

        return;

      }


      supabaseClient.auth.onAuthStateChange(
        function(event, session) {

          if (session) {

            loadFavorites();

          } else {

            document
              .querySelectorAll(
                ".favorite-button"
              )
              .forEach(
                function(button) {

                  button.classList.remove(
                    "active"
                  );

                  button.textContent =
                    "♡";

                }
              );

          }

        }
      );

    }


    /*
      ==========================================
      SUPABASE SCRIPT LADEN
      ==========================================
    */

    function loadSupabaseScript() {

      if (
        document.getElementById(
          "supabaseScript"
        )
      ) {

        return;

      }


      const script =
        document.createElement(
          "script"
        );

      script.id =
        "supabaseScript";

      script.src =
        "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";


      script.onload =
        function() {

          if (initSupabase()) {

            setupAuthListener();
            loadFavorites();

          }

        };


      script.onerror =
        function() {

          console.error(
            "Supabase-Script konnte nicht geladen werden."
          );

        };


      document.head.appendChild(
        script
      );

    }


    /*
      ==========================================
      START
      ==========================================
    */

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        loadProducts();

        loadSupabaseScript();

      }
    );

  </script>

</body>
</html>
