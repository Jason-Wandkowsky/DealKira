<body>

  <site-header></site-header>

  <section class="hero">
    <h1>Indoor-<span>Kameras</span></h1>

    <div class="filter-message" id="filterMessage">
      Sobald hier Produkte sind, kannst du nach Marke filtern.
    </div>

    <div class="products" data-kategorie="indoor-kameras">

      <div class="empty-state">
        <div class="empty-icon">🏠</div>
        <h2>Noch keine Produkte vorhanden</h2>
        <p>Hier werden bald passende Indoor-Kameras und Angebote angezeigt.</p>
      </div>

    </div>

  </main>

  <site-footer></site-footer>

  <script src="kategorie.js?v=20261018"></script>
