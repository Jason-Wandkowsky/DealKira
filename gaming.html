<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="DealKira – Gaming-Produkte und Gaming-Deals entdecken."
  >

  <meta name="theme-color" content="#111111">

  <title>DealKira – Gaming</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #111;
      line-height: 1.5;
    }


    /* =========================
       HEADER
    ========================== */

    header {
      height: 72px;
      background: #111;
      padding: 0 6%;

      display: flex;
      justify-content: space-between;
      align-items: center;

      position: sticky;
      top: 0;
      z-index: 1000;

      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
    }


    /* =========================
       LOGO
    ========================== */

    .logo {
      width: 220px;
      height: 55px;

      display: flex;
      align-items: center;

      overflow: visible;
      position: relative;
    }

    .logo img {
      height: 240px;
      width: auto;
      max-width: none;

      display: block;

      transform-origin: left center;
    }


    /* =========================
       HAMBURGER
    ========================== */

    .menu-button {
      width: 48px;
      height: 48px;

      background: #1c1c1c;

      border: 1px solid #333;
      border-radius: 10px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      gap: 5px;

      cursor: pointer;

      transition: 0.2s;

      position: relative;
      z-index: 1100;
    }

    .menu-button:hover {
      background: #252525;
      border-color: #ffd400;
    }

    .menu-button span {
      width: 23px;
      height: 3px;

      background: #ffd400;

      border-radius: 3px;

      transition: 0.25s;
    }

    .menu-button.active span:nth-child(1) {
      transform: translateY(8px) rotate(45deg);
    }

    .menu-button.active span:nth-child(2) {
      opacity: 0;
    }

    .menu-button.active span:nth-child(3) {
      transform: translateY(-8px) rotate(-45deg);
    }


    /* =========================
       MENU
    ========================== */

    .menu-panel {
      position: absolute;

      top: 82px;
      right: 6%;

      width: 270px;

      background: #111;

      border: 1px solid #333;
      border-radius: 14px;

      padding: 10px;

      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);

      opacity: 0;
      visibility: hidden;

      transform: translateY(-10px);

      transition: 0.2s ease;
    }

    .menu-panel.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .menu-panel a {
      display: flex;
      align-items: center;

      gap: 12px;

      color: white;

      text-decoration: none;

      padding: 14px 15px;

      border-radius: 9px;

      font-weight: 700;

      transition: 0.2s;
    }

    .menu-panel a:hover {
      background: #222;
      color: #ffd400;
    }

    .menu-icon {
      width: 25px;
      text-align: center;
      font-size: 19px;
    }

    .menu-divider {
      height: 1px;
      background: #333;
      margin: 8px 5px;
    }


    /* =========================
       PAGE HEADER
    ========================== */

    .page-header {
      background:
        linear-gradient(
          135deg,
          #111 0%,
          #202020 100%
        );

      color: white;

      text-align: center;

      padding: 70px 20px 65px;
    }

    .page-header h1 {
      font-size: clamp(38px, 6vw, 60px);

      font-weight: 900;

      margin-bottom: 12px;
    }

    .page-header h1 span {
      color: #ffd400;
    }

    .page-header p {
      color: #d6d6d6;
      font-size: 18px;
    }


    /* =========================
       PRODUCTS
    ========================== */

    .products-section {
      padding: 60px 0 80px;
    }

    .container {
      width: min(1180px, 92%);
      margin: auto;
    }

    .product-grid {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 20px;
    }


    /* =========================
       PRODUCT CARD
    ========================== */

    .product-card {
      background: white;

      border-radius: 18px;

      overflow: hidden;

      position: relative;

      border: 1px solid #e8e8e8;

      box-shadow:
        0 5px 18px rgba(0, 0, 0, 0.05);

      transition: 0.25s;
    }

    .product-card:hover {
      transform: translateY(-6px);

      box-shadow:
        0 18px 35px rgba(0, 0, 0, 0.12);
    }


    /* =========================
       PRODUCT IMAGE
    ========================== */

    .product-image {
      height: 220px;

      background:
        radial-gradient(
          circle at 50% 30%,
          #ffffff 0%,
          #f4f4f4 55%,
          #e7e7e7 100%
        );

      display: flex;

      justify-content: center;
      align-items: center;

      position: relative;

      overflow: hidden;
    }

    .product-image::after {
      content: "";

      position: absolute;

      width: 130px;
      height: 25px;

      background:
        rgba(0, 0, 0, 0.10);

      filter: blur(12px);

      bottom: 25px;

      border-radius: 50%;
    }

    .product-icon {
      font-size: 105px;

      position: relative;

      z-index: 2;

      filter:
        drop-shadow(
          0 12px 12px
          rgba(0, 0, 0, 0.18)
        );
    }


    /* =========================
       BADGE
    ========================== */

    .deal-badge {
      display: inline-block;

      background: #111;

      color: #ffd400;

      font-size: 11px;

      font-weight: 900;

      padding: 5px 8px;

      border-radius: 8px;

      margin-bottom: 10px;
    }


    /* =========================
       CARD CONTENT
    ========================== */

    .card-content {
      padding: 18px;
    }

    .card-content h3 {
      font-size: 17px;

      margin-bottom: 8px;

      line-height: 1.3;
    }

    .category-label {
      font-size: 13px;

      color: #777;

      margin-bottom: 14px;
    }

    .check-price {
      display: block;

      width: 100%;

      background: #ffd400;

      color: #111;

      text-align: center;

      text-decoration: none;

      font-weight: 900;

      padding: 12px;

      border-radius: 10px;

      transition: 0.2s;
    }

    .check-price:hover {
      background: #ffdf3c;

      transform: translateY(-1px);
    }


    /* =========================
       EMPTY CATEGORY
    ========================== */

    .empty-category {
      text-align: center;

      background: white;

      border: 1px solid #e8e8e8;

      border-radius: 18px;

      padding: 60px 25px;

      color: #777;

      box-shadow:
        0 5px 18px rgba(0, 0, 0, 0.05);
    }


    /* =========================
       FOOTER
    ========================== */

    footer {
      background: #111;

      color: #aaa;

      text-align: center;

      padding: 35px 20px;
    }

    footer .footer-logo {
      color: white;

      font-size: 22px;

      font-weight: 900;

      margin-bottom: 10px;
    }

    footer .footer-logo span {
      color: #ffd400;
    }

    footer p {
      font-size: 13px;
    }


    /* =========================
       RESPONSIVE
    ========================== */

    @media (max-width: 1100px) {

      .product-grid {
        grid-template-columns:
          repeat(3, 1fr);
      }

    }


    @media (max-width: 800px) {

      header {
        padding: 0 5%;
      }

      .logo {
        width: 180px;
      }

      .logo img {
        height: 210px;
      }

      .menu-panel {
        right: 5%;
      }

      .product-grid {
        grid-template-columns:
          repeat(2, 1fr);
      }

    }


    @media (max-width: 550px) {

      header {
        height: 68px;
        padding: 0 5%;
      }

      .logo {
        width: 145px;
        height: 50px;
      }

      .logo img {
        height: 184px;
      }

      .menu-button {
        width: 45px;
        height: 45px;
      }

      .menu-panel {
        top: 78px;
        right: 5%;
        width: 260px;
      }

      .page-header {
        padding: 55px 20px;
      }

      .product-grid {
        grid-template-columns: 1fr;
      }

    }

  </style>
</head>


<body>


  <!-- =========================
       HEADER
  ========================== -->

  <header>

    <div class="logo">

      <img
        src="20879_nobg (1).png"
        alt="DealKira Logo"
      >

    </div>


    <!-- HAMBURGER -->

    <button
      class="menu-button"
      id="menuButton"
      onclick="toggleMenu()"
      aria-label="Menü öffnen"
      aria-expanded="false"
    >

      <span></span>
      <span></span>
      <span></span>

    </button>


    <!-- MENU -->

    <div
      class="menu-panel"
      id="menuPanel"
    >

      <a href="index.html">
        <span class="menu-icon">🏠</span>
        Startseite
      </a>

      <a href="deals.html">
        <span class="menu-icon">🔥</span>
        Deals
      </a>

      <a href="kategorien.html">
        <span class="menu-icon">📂</span>
        Kategorien
      </a>

      <a href="suche.html">
        <span class="menu-icon">🔍</span>
        Suche
      </a>

      <div class="menu-divider"></div>

      <a href="konto.html">
        <span class="menu-icon">👤</span>
        Konto / Anmelden
      </a>

    </div>

  </header>


  <!-- =========================
       PAGE HEADER
  ========================== -->

  <section class="page-header">

    <h1>
      <span>Gaming</span>
    </h1>

    <p>
      Entdecke Gaming-Produkte und aktuelle Angebote.
    </p>

  </section>


  <!-- =========================
       PRODUCTS
  ========================== -->

  <main>

    <section class="products-section">

      <div class="container">

        <div class="product-grid">


          <!-- PLAYSTATION 5 -->

          <article class="product-card">

            <div class="product-image">

              <div class="product-icon">
                🎮
              </div>

            </div>

            <div class="card-content">

              <span class="deal-badge">
                Deal
              </span>

              <h3>
                PlayStation 5
              </h3>

              <div class="category-label">
                Gaming
              </div>

              <a
                class="check-price"
                href="https://amzn.to/4yW9vEp"
                target="_blank"
                rel="nofollow sponsored"
              >
                Preis auf Amazon prüfen
              </a>

            </div>

          </article>


        </div>

      </div>

    </section>

  </main>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer>

    <div class="footer-logo">
      Deal<span>Kira</span>
    </div>

    <p>
      Produkte entdecken. Deals finden. Preise vergleichen.
    </p>

  </footer>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script>

    function toggleMenu() {

      const menu =
        document.getElementById("menuPanel");

      const button =
        document.getElementById("menuButton");

      const isOpen =
        menu.classList.toggle("open");

      button.classList.toggle("active");

      button.setAttribute(
        "aria-expanded",
        isOpen
      );

    }


    function closeMenu() {

      const menu =
        document.getElementById("menuPanel");

      const button =
        document.getElementById("menuButton");

      menu.classList.remove("open");

      button.classList.remove("active");

      button.setAttribute(
        "aria-expanded",
        "false"
      );

    }


    document.addEventListener(
      "click",
      function(event) {

        const menu =
          document.getElementById("menuPanel");

        const button =
          document.getElementById("menuButton");

        if (
          !menu.contains(event.target) &&
          !button.contains(event.target)
        ) {

          closeMenu();

        }

      }
    );


    document.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Escape") {

          closeMenu();

        }

      }
    );

  </script>


</body>
</html>
