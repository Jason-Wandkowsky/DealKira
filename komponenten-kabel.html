<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Komponenten Kabel – DealKira</title>

  <link rel="stylesheet" href="basis.css">
<link rel="stylesheet" href="bausteine.css">
<script src="basis.js"></script>

<style>

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
      min-height: 100vh;
    }

  </style>
</head>

<body>

  <site-header></site-header>

  <section class="page-header">

    <h1>Komponenten <span>Kabel</span></h1>

    <p>
      Kabel für PC-Komponenten und interne Anschlüsse entdecken
    </p>

  </section>

  <section class="products-section">

    <div class="products-top">

      <button
        class="filter-button"
        onclick="toggleFilter()"
      >
        ⚙️ Filter
      </button>

    </div>

    <div
      class="filter-message"
      id="filterMessage"
    >
      Der Filter befindet sich noch in Bearbeitung.
    </div>

    <div class="products">

      <div class="empty-state">

        <div class="empty-icon">
          🔌
        </div>

        <h2>
          Noch keine Produkte vorhanden
        </h2>

        <p>
          In dieser Kategorie werden bald passende Produkte und Deals angezeigt.
        </p>

      </div>

    </div>

  </section>

  <site-footer></site-footer>

</body>
</html>
