<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suche – DealKira</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */

    header {
      height: 82px;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
      position: relative;
      z-index: 1000;
    }

    .logo {
      width: 280px;
      height: 65px;
      display: flex;
      align-items: center;
      overflow: visible;
      position: relative;
    }

    .logo img {
      height: 320px;
      width: auto;
      max-width: none;
      display: block;
    }

    /* BURGER MENÜ */

    .menu-button {
      width: 48px;
      height: 48px;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: 0.2s;
    }

    .menu-button span {
      width: 23px;
      height: 3px;
      background: #ffd400;
      border-radius: 3px;
      transition: 0.2s;
    }

    .menu-button:hover {
      background: #252525;
      border-color: #ffd400;
    }

    .menu-button.active span:nth-child(1) {
      transform: translateY(8px) rotate(45deg);
    }

    .menu-button.active span:nth-child(2) {
      opacity: 0;
    }

    .menu-button.active span:nth-child(3) {
      transform: translateY(-8px) rotate(-45deg);
    }

    .menu-panel {
      position: absolute;
      top: 82px;
      right: 6%;
      width: 270px;
      background: #111;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 10px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.5);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: 0.2s;
    }

    .menu-panel.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .menu-panel a {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
      text-decoration: none;
      padding: 14px 15px;
      border-radius: 9px;
      font-weight: 700;
      transition: 0.2s;
    }

    .menu-panel a:hover {
      background: #222;
      color: #ffd400;
    }

    .menu-icon {
      width: 25px;
      text-align: center;
      font-size: 19px;
    }

    .menu-divider {
      height: 1px;
      background: #333;
      margin: 8px 5px;
    }

    /* HERO */

    .hero {
      background: #111;
      color: #fff;
      text-align: center;
      padding: 55px 20px 60px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .hero h1 span {
      color: #ffd400;
    }

    .hero p {
      font-size: 18px;
      color: #ccc;
    }

    /* SUCHBEREICH */

    .search-section {
      max-width: 900px;
      margin: 45px auto 70px;
      padding: 0 20px;
    }

    .search-box {
      display: flex;
      width: 100%;
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      border: 1px solid #ddd;
    }

    .search-box input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      padding: 18px 20px;
      font-size: 18px;
      color: #111;
      background: #fff;
    }

    .search-box input::placeholder {
      color: #888;
    }

    /* CLEAR BUTTON */

    .clear-button {
      width: 55px;
      min-width: 55px;
      border: none;
      background: #fff;
      color: #777;
      font-size: 29px;
      font-weight: 400;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .clear-button:hover {
      color: #111;
      background: #f2f2f2;
    }

    .search-button {
      width: 65px;
      min-width: 65px;
      border: none;
      background: #ffd400;
      color: #111;
      font-size: 30px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .search-button:hover {
      background: #e6bf00;
    }

    /* FILTER */

    .filter-area {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .result-count {
      margin-right: auto;
      color: #555;
      font-size: 15px;
      font-weight: 700;
    }

    .filter-button {
      background: #ffd400;
      color: #111;
      border: none;
      border-radius: 10px;
      padding: 12px 22px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .filter-button:hover {
      transform: translateY(-2px);
    }

    .filter-message {
      display: none;
      background: #fff;
      border-radius: 12px;
      padding: 15px 18px;
      margin-top: 20px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
      color: #555;
    }

    .filter-message.show {
      display: block;
    }

    /* SUCHERGEBNISSE */

    .results {
      margin-top: 30px;
      display: none;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
    }

    .results.show {
      display: grid;
    }

    /* PRODUKTKARTE */

    .result-card {
      position: relative;
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      text-decoration: none;
      color: #111;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
      transition: 0.2s;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .result-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
    }

    .result-image-box {
      width: 100%;
      height: 240px;
      background: #fff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      overflow: hidden;
    }

    .result-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .result-no-image {
      font-size: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    .result-brand {
      font-size: 13px;
      font-weight: 700;
      color: #777;
      margin-bottom: 7px;
      text-transform: uppercase;
    }

    .result-card h2 {
      font-size: 20px;
      margin-bottom: 15px;
      line-height: 1.25;
    }

    .result-category {
      color: #666;
      font-size: 13px;
      margin-bottom: 14px;
    }

    .result-bottom {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .result-price {
      font-size: 19px;
      font-weight: 700;
      color: #111;
    }

    .result-price.empty {
      font-size: 14px;
      font-weight: 400;
      color: #777;
    }

    .deal-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #ffd400;
      color: #111;
      text-decoration: none;
      border-radius: 9px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      transition: 0.2s;
    }

    .deal-button:hover {
      background: #e6bf00;
    }

    /* FOOTER */

    footer {
      background: #111;
      color: #aaa;
      text-align: center;
      padding: 30px 20px;
      font-size: 14px;
      margin-top: auto;
    }

    /* TABLET */

    @media (max-width: 800px) {

      .logo {
        width: 225px;
      }

      .logo img {
        height: 275px;
      }

    }

    /* MOBILE */

    @media (max-width: 550px) {

      header {
        padding: 0 5%;
      }

      .logo {
        width: 190px;
        height: 50px;
      }

      .logo img {
        height: 235px;
      }

      .menu-panel {
        right: 5%;
        width: 270px;
      }

      .hero {
        padding: 42px 15px 48px;
      }

      .hero h1 {
        font-size: 30px;
      }

      .hero p {
        font-size: 15px;
      }

      .search-section {
        margin: 35px auto 50px;
        padding: 0 12px;
      }

      .search-box input {
        padding: 15px 14px;
        font-size: 16px;
      }

      .clear-button {
        width: 45px;
        min-width: 45px;
        font-size: 26px;
      }

      .search-button {
        width: 58px;
        min-width: 58px;
        font-size: 27px;
      }

      .filter-area {
        margin-top: 15px;
      }

      .result-count {
        font-size: 12px;
      }

      .filter-button {
        padding: 10px 17px;
        font-size: 14px;
      }

      .results {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 22px;
      }

      .result-card {
        padding: 12px 10px;
        border-radius: 13px;
      }

      .result-image-box {
        height: 145px;
        border-radius: 10px;
        margin-bottom: 12px;
      }

      .result-no-image {
        font-size: 43px;
      }

      .result-brand {
        font-size: 10px;
        margin-bottom: 5px;
      }

      .result-card h2 {
        font-size: 16px;
        margin-bottom: 10px;
      }

      .result-category {
        font-size: 11px;
        margin-bottom: 10px;
      }

      .result-bottom {
        gap: 5px;
        align-items: flex-end;
      }

      .result-price {
        font-size: 14px;
      }

      .result-price.empty {
        font-size: 10px;
      }

      .deal-button {
        padding: 8px 9px;
        font-size: 11px;
        border-radius: 7px;
      }

    }

    /* SEHR KLEINE HANDYS */

    @media (max-width: 380px) {

      .logo {
        width: 170px;
      }

      .logo img {
        height: 215px;
      }

      .menu-button {
        width: 45px;
        height: 45px;
      }

      .result-count {
        font-size: 11px;
      }

    }
  </style>
</head>

<header>

<footer>

</footer>


<script>

  /* BURGER MENÜ */

  function toggleMenu() {

    const menu = document.getElementById("menuPanel");
    const button = document.getElementById("menuButton");

    const isOpen = menu.classList.toggle("open");

    button.classList.toggle("active");

    button.setAttribute(
      "aria-expanded",
      isOpen
    );

  }


  function closeMenu() {

    const menu = document.getElementById("menuPanel");
    const button = document.getElementById("menuButton");

    menu.classList.remove("open");

    button.classList.remove("active");

    button.setAttribute(
      "aria-expanded",
      "false"
    );

  }


  document.addEventListener(
    "click",
    function(event) {

      const menu =
        document.getElementById("menuPanel");

      const button =
        document.getElementById("menuButton");

      if (
        !menu.contains(event.target) &&
        !button.contains(event.target)
      ) {

        closeMenu();

      }

    }
  );


  document.addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Escape") {

        closeMenu();

      }

    }
  );


  /* FILTER */

  function toggleFilter() {

    const message =
      document.getElementById("filterMessage");

    message.classList.toggle("show");

  }


  /* ALLE PRODUKTE */

  let allProducts = [];


  /*
    Hier können später ganz einfach weitere
    JSON-Dateien ergänzt werden.
  */

  const productSources = [

    {
      file: "telefone.json",
      category: "Telefone",
      detailPage: "produkt.html"
    },

    {
      file: "tablets.json",
      category: "Tablets",
      detailPage: "tablet-produkt.html"
    }

  ];


  /* PRODUKTE AUS JSON LADEN */

  async function loadProducts() {

    try {

      const loadedProducts = [];

      for (
        const source of productSources
      ) {

        try {

          const response =
            await fetch(source.file);

          if (!response.ok) {

            console.warn(
              "JSON konnte nicht geladen werden:",
              source.file
            );

            continue;

          }

          const products =
            await response.json();


          if (!Array.isArray(products)) {

            console.warn(
              "JSON ist kein Array:",
              source.file
            );

            continue;

          }


          products.forEach(
            function(product) {

              loadedProducts.push({

                ...product,

                searchCategory:
                  source.category,

                detailPage:
                  source.detailPage

              });

            }
          );

        } catch (error) {

          console.error(
            "Fehler beim Laden von",
            source.file,
            error
          );

        }

      }


      allProducts =
        loadedProducts;


      console.log(
        "Produkte für Suche geladen:",
        allProducts.length
      );

    } catch (error) {

      console.error(
        "Fehler beim Laden der Produkte:",
        error
      );

    }

  }


  /* HILFSFUNKTION FÜR HTML */

  function escapeHTML(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* PREIS AUS SHOPS HOLEN */

  function getPrimaryShop(product) {

    if (
      Array.isArray(product.shops) &&
      product.shops.length > 0
    ) {

      return product.shops[0];

    }

    return null;

  }


  /* PREIS FORMATIEREN */

  function formatPrice(price) {

    if (
      price === null ||
      price === undefined ||
      price === ""
    ) {

      return "";

    }


    const value =
      String(price).trim();


    if (
      value.includes("€")
    ) {

      return value;

    }


    return value + " €";

  }


  /* BILD ERMITTELN */

  function getProductImage(product) {

    return (
      product.image ||
      product.bild ||
      product.img ||
      product.imageUrl ||
      ""
    );

  }


  /* PRODUKTKARTE ERSTELLEN */

  function createProductCard(product) {

    const card =
      document.createElement("a");

    card.className =
      "result-card";


    const productId =
      product.id || "";


    const detailPage =
      product.detailPage ||
      "produkt.html";


    card.href =
      detailPage +
      "?id=" +
      encodeURIComponent(productId);


    const image =
      getProductImage(product);


    const shop =
      getPrimaryShop(product);


    const price =
      shop?.price || "";


    const brand =
      product.brand || "";


    const name =
      product.name ||
      "Produkt";


    const category =
      product.searchCategory ||
      "";


    let imageHTML;


    if (image) {

      imageHTML = `
        <img
          class="result-image"
          src="${escapeHTML(image)}"
          alt="${escapeHTML(name)}"
          loading="lazy"
          onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
        >

        <div
          class="result-no-image"
          style="display:none;"
        >
          📦
        </div>
      `;

    } else {

      imageHTML = `
        <div class="result-no-image">
          📦
        </div>
      `;

    }


    const priceHTML =
      price
        ? `<div class="result-price">${escapeHTML(formatPrice(price))}</div>`
        : `<div class="result-price empty">Preis ansehen</div>`;


    card.innerHTML = `

      <div class="result-image-box">

        ${imageHTML}

      </div>


      <div class="result-brand">

        ${escapeHTML(brand)}

      </div>


      <h2>

        ${escapeHTML(name)}

      </h2>


      <div class="result-category">

        ${escapeHTML(category)}

      </div>


      <div class="result-bottom">

        ${priceHTML}

        <span class="deal-button">

          Zum Deal

        </span>

      </div>

    `;


    return card;

  }


  /* ERGEBNISSE RENDERN */

  function renderResults(products) {

    const results =
      document.getElementById("results");


    results
      .querySelectorAll(".result-card")
      .forEach(
        function(card) {

          card.remove();

        }
      );


    products.forEach(
      function(product) {

        const card =
          createProductCard(product);

        results.appendChild(card);

      }
    );

  }


  /* FEHLERTOLERANTE SUCHE */

  function levenshteinDistance(a, b) {

    const matrix = [];

    for (let i = 0; i <= b.length; i++) {

      matrix[i] = [i];

    }

    for (let j = 0; j <= a.length; j++) {

      matrix[0][j] = j;

    }

    for (let i = 1; i <= b.length; i++) {

      for (let j = 1; j <= a.length; j++) {

        if (
          b.charAt(i - 1) ===
          a.charAt(j - 1)
        ) {

          matrix[i][j] =
            matrix[i - 1][j - 1];

        } else {

          matrix[i][j] =
            Math.min(

              matrix[i - 1][j - 1] + 1,

              matrix[i][j - 1] + 1,

              matrix[i - 1][j] + 1

            );

        }

      }

    }

    return matrix[b.length][a.length];

  }


  /*
    Prüft, ob ein Suchwort wie eine Modellnummer
    aussieht.

    Beispiele:
    S26
    S26+
    A56
    A16
    ZFOLD7
    ZFLIP7
    IPHONE17
    17PRO

    Solche Begriffe dürfen NICHT durch die
    normale Rechtschreibkorrektur ersetzt werden.
  */

  function isModelToken(word) {

    const normalized =
      word
        .toLowerCase()
        .replace(/[^a-z0-9]/g, "");

    if (!normalized) {

      return false;

    }


    /*
      Buchstaben + Zahl
      z.B. s26, a56, zfold7
    */

    if (
      /^[a-z]+\d+[a-z]*$/i.test(normalized)
    ) {

      return true;

    }


    /*
      Zahl + Buchstaben
      z.B. 17pro
    */

    if (
      /^\d+[a-z]+$/i.test(normalized)
    ) {

      return true;

    }


    /*
      Reine Modellnummern mit mindestens
      zwei Ziffern.
    */

    if (
      /^\d{2,}[a-z]*$/i.test(normalized)
    ) {

      return true;

    }


    return false;

  }


  /*
    Suchwort gegen Produkttext prüfen.

    WICHTIG:
    Modellnummern werden exakt gesucht.
    Dadurch wird S26 NICHT mehr mit S25,
    S24, S23 usw. verwechselt.
  */

  function matchSearchWord(
    searchWord,
    textWords
  ) {

    const normalizedSearchWord =
      searchWord
        .toLowerCase()
        .trim();


    if (
      !normalizedSearchWord
    ) {

      return false;

    }


    /*
      Modellnummer:
      Nur exakter Treffer.
    */

    if (
      isModelToken(normalizedSearchWord)
    ) {

      const cleanSearchWord =
        normalizedSearchWord
          .replace(/[^a-z0-9]/g, "");


      for (
        const textWord of textWords
      ) {

        const cleanTextWord =
          textWord
            .toLowerCase()
            .replace(/[^a-z0-9]/g, "");


        /*
          Exakte Modellnummer oder Modellnummer
          am Anfang des Produktwortes.

          Dadurch wird:
          S26 → S26
          S26 → S26+
          S26 → S26 Ultra

          aber NICHT:
          S26 → S25
          S26 → S24
        */

        if (
          cleanTextWord === cleanSearchWord ||
          cleanTextWord.startsWith(cleanSearchWord)
        ) {

          return true;

        }

      }


      return false;

    }


    /*
      Normale Suchbegriffe:
      Teiltreffer erlauben.
    */

    for (
      const textWord of textWords
    ) {

      if (
        textWord.includes(normalizedSearchWord)
      ) {

        return true;

      }


      /*
        Rechtschreibfehler weiterhin erlauben,
        aber nicht bei Modellnummern.
      */

      const distance =
        levenshteinDistance(
          normalizedSearchWord,
          textWord
        );


      let allowedDistance = 1;


      if (
        normalizedSearchWord.length >= 7
      ) {

        allowedDistance = 2;

      }


      if (
        normalizedSearchWord.length >= 11
      ) {

        allowedDistance = 3;

      }


      if (
        distance <= allowedDistance
      ) {

        return true;

      }

    }


    return false;

  }


  function fuzzyMatch(searchTerm, text) {

    searchTerm =
      searchTerm.toLowerCase().trim();

    text =
      text.toLowerCase().trim();


    if (
      !searchTerm ||
      !text
    ) {

      return false;

    }


    /*
      Suchbegriffe aufteilen.
    */

    const searchWords =
      searchTerm.split(/\s+/);


    /*
      Produkttext ebenfalls in einzelne
      Wörter zerlegen.
    */

    const textWords =
      text
        .split(/\s+/)
        .map(
          function(word) {

            return word
              .replace(/[(),/|]/g, "");

          }
        )
        .filter(Boolean);


    /*
      JEDES relevante Suchwort muss im
      Produkt vorhanden sein.

      Dadurch bedeutet:

      Galaxy S26

      → Galaxy muss vorhanden sein
      → S26 muss vorhanden sein
    */

    for (
      const searchWord of searchWords
    ) {

      if (
        searchWord.length < 2
      ) {

        continue;

      }


      const wordFound =
        matchSearchWord(
          searchWord,
          textWords
        );


      if (!wordFound) {

        return false;

      }

    }


    return true;

  }


  /* PRODUKTSUCHE */

  function searchProducts() {

    const input =
      document.getElementById("searchInput");

    const searchTerm =
      input.value.toLowerCase().trim();


    const results =
      document.getElementById("results");

    const resultCount =
      document.getElementById("resultCount");


    /* Keine Eingabe */

    if (searchTerm === "") {

      results.classList.remove("show");

      resultCount.textContent = "";

      renderResults([]);

      return;

    }


    /*
      Name + Marke + Kategorie + Serie
      durchsuchen.
    */

    const foundProducts =
      allProducts.filter(
        function(product) {

          const name =
            product.name || "";

          const brand =
            product.brand || "";

          const category =
            product.searchCategory || "";

          const series =
            product.series || "";


          const combinedText =
            name +
            " " +
            brand +
            " " +
            category +
            " " +
            series;


          return fuzzyMatch(
            searchTerm,
            combinedText
          );

        }
      );


    /* ERGEBNISANZAHL ANZEIGEN */

    if (
      foundProducts.length > 0
    ) {

      resultCount.textContent =
        foundProducts.length +
        (
          foundProducts.length === 1
            ? " Produkt gefunden"
            : " Produkte gefunden"
        );

    } else {

      resultCount.textContent =
        "Keine Produkte gefunden";

    }


    /* ERGEBNISSE SICHTBAR MACHEN */

    if (
      foundProducts.length > 0
    ) {

      results.classList.add("show");

    } else {

      results.classList.remove("show");

    }


    renderResults(
      foundProducts
    );

  }


  /* SUCHE LÖSCHEN */

  function clearSearch() {

    const input =
      document.getElementById("searchInput");

    const results =
      document.getElementById("results");

    const resultCount =
      document.getElementById("resultCount");


    input.value = "";

    results.classList.remove("show");

    resultCount.textContent = "";

    renderResults([]);

    input.focus();

  }


  /* ENTER-TASTE */

  document
    .getElementById("searchInput")
    .addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          searchProducts();

        }

      }
    );


  /* PRODUKTE BEIM START LADEN */

  loadProducts();

</script>
